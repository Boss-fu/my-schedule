<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>家長端預覽</title>
<style>:root{--ink:#1b2735;--muted:#657388;--line:#dbe4ee;--blue:#2d7dcc;--bg:#f4f7fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,"PingFang TC",sans-serif}.wrap{max-width:1060px;margin:auto;padding:22px}.head,.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 3px 14px rgba(25,45,72,.05)}.head{padding:18px 20px;display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:14px}h1,h2,p{margin:0}h1{font-size:22px}h2{font-size:17px}.muted{color:var(--muted)}.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-top:13px}label{display:grid;gap:4px;font-size:12px;font-weight:800;color:var(--muted)}select,textarea{font:inherit;border:1px solid #cbd7e4;border-radius:8px;padding:8px;background:#fff;color:var(--ink)}.tabs{display:flex;gap:5px;overflow:auto;margin-bottom:14px}.tabs button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 12px;font:inherit;font-weight:800;cursor:pointer}.tabs button.active{background:var(--blue);border-color:var(--blue);color:#fff}.view{display:none}.view.active{display:block}.card{padding:18px;margin-bottom:14px}.week,.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.week{text-align:center;color:var(--muted);font-size:12px;font-weight:800}.day{min-height:88px;border:1px solid var(--line);border-radius:9px;padding:6px;background:#fff}.day.other{opacity:.4;background:#f2f5f8}.day b{font-size:12px}.event{margin-top:4px;padding:3px 5px;border-radius:5px;font-size:11px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;background:var(--bgc);color:var(--fgc)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--muted)}.detail{white-space:pre-line}.empty{color:var(--muted);text-align:center;padding:28px}.course-table{border-collapse:separate;border-spacing:0 7px}.course-row{cursor:pointer;transition:.15s}.course-row td{padding:15px 14px;background:#fff;border-top:1px solid #e2e9f1;border-bottom:1px solid #e2e9f1;vertical-align:middle}.course-row td:first-child{border-left:1px solid #e2e9f1;border-radius:10px 0 0 10px;white-space:nowrap}.course-row td:last-child{border-right:1px solid #e2e9f1;border-radius:0 10px 10px 0}.course-row:hover td,.course-row.open td{background:#f0f7ff;border-color:#bcdaf5}.course-detail{display:none}.course-detail.open{display:table-row}.course-detail td{padding:0 14px 15px;background:#f0f7ff;border:1px solid #bcdaf5;border-top:0;border-radius:0 0 10px 10px}.notes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding-top:5px}.notes div{padding:11px 12px;background:#fff;border:1px solid #d8e7f5;border-radius:8px;white-space:pre-line}.notes b{display:block;color:#2869a8;font-size:12px}.invoice-choice{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.invoice-choice button{cursor:pointer;border:1px solid #cfe0f1;background:#f5faff;color:#205c95;border-radius:9px;padding:10px 12px;font:inherit;font-weight:800}.invoice{max-width:820px;margin:16px auto;background:#fff;padding:26px;border:1px solid #cbd9e7}.invoice-head{border-bottom:2px solid var(--blue);padding-bottom:14px;margin-bottom:18px}.invoice h2{font-size:25px}.metrics{display:flex;gap:10px;margin:15px 0}.metrics div{flex:1;padding:10px;text-align:center;border-radius:8px;background:#eef5fc}.metrics b{display:block;font-size:19px}.amount{margin-top:16px;text-align:right;padding:14px;background:#e6f2ff;font-size:18px}.feedback-list{display:grid;gap:9px;margin:14px 0}.message{padding:11px 12px;border-radius:9px;background:#f4f7fb;white-space:pre-line}.message small{display:block;color:var(--muted);margin-top:4px}.feedback-form{display:grid;gap:8px}.feedback-form textarea{min-height:92px;resize:vertical}.feedback-form button{justify-self:start;border:0;border-radius:8px;background:var(--blue);color:#fff;padding:9px 13px;font:inherit;font-weight:800;cursor:pointer}@media(max-width:650px){.wrap{padding:12px}.head{display:block}.week,.calendar{gap:2px}.day{min-height:62px;padding:3px}.event{font-size:9px}.metrics,.notes{display:grid;grid-template-columns:1fr}.invoice{padding:16px}table{font-size:12px}}</style></head>
<body><main class="wrap"><header class="head"><div><h1>福大自然家教管理系統</h1><p class="muted">家長端｜課程資料與學費單</p></div><label>學生<select id="student"></select></label></header><nav class="tabs"><button class="active" data-view="calendar">課次與月曆</button><button data-view="coursework">學生課務</button><button data-view="invoice">學費單</button><button data-view="feedback">家長回饋</button></nav><section class="view active" id="calendar"><article class="card"><div class="filters"><label>月份<select id="month"></select></label></div><div class="week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div id="calendarGrid" class="calendar"></div></article></section><section class="view" id="coursework"><article class="card"><h2>學生課務</h2><p class="muted">點選任何一堂課可展開完整內容；此頁資料為唯讀。</p><div id="courseworkList"></div></article></section><section class="view" id="invoice"><article class="card"><h2>學費單預覽</h2><p class="muted">點選月份即可直接預覽當月學費單。</p><div id="invoiceChoices" class="invoice-choice"></div><div id="invoicePreview"></div></article></section><section class="view" id="feedback"><article class="card"><h2>親師溝通／家長回饋</h2><p class="muted">課程資料均為唯讀；您可以在此留下回饋或問題。</p><div id="feedbackList" class="feedback-list"></div><form id="feedbackForm" class="feedback-form"><textarea id="feedbackBody" maxlength="2000" placeholder="請輸入想與老師溝通的內容…" required></textarea><button>送出家長回饋</button><span id="feedbackNotice" class="muted"></span></form></article></section></main>
<script src="supabase-config.js"></script><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const db=createClient(window.SUPABASE_CONFIG.url,window.SUPABASE_CONFIG.publishableKey),$=id=>document.getElementById(id),money=n=>'NT$ '+Number(n||0).toLocaleString('zh-TW'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let students=[],lessons=[],messages=[],session=null;const colors=[['#e1effd','#185995'],['#e5f5ef','#1a6f59'],['#fff0d8','#91570a'],['#f0e9fb','#6b479b'],['#fde9ed','#9c3d59']];function keyColor(l){const k=`${l.students?.name||''}|${l.topic||''}`,n=[...k].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7),x=colors[n%colors.length];return `--bgc:${x[0]};--fgc:${x[1]}`}function shown(){return lessons.filter(l=>l.student_id===$('student').value)}function months(){return [...new Set(shown().map(l=>l.lesson_date.slice(0,7)))].sort().reverse()}function localDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function renderCalendar(){const ms=months(),m=$('month').value||ms[0]||new Date().toISOString().slice(0,7);$('month').innerHTML=ms.map(x=>`<option value="${x}">${x}</option>`).join('')||'<option value="">尚無課次</option>';$('month').value=m;const[y,mo]=m.split('-').map(Number),start=new Date(y,mo-1,1-new Date(y,mo-1,1).getDay()),list=shown();let h='';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const iso=localDate(d),items=list.filter(l=>l.lesson_date===iso);h+=`<div class="day ${d.getMonth()!==mo-1?'other':''}"><b>${d.getDate()}</b>${items.map(l=>`<div class="event" style="${keyColor(l)}">${esc(l.topic||'N/A')} ${l.start_time?.slice(0,5)||''}</div>`).join('')}</div>`}$('calendarGrid').innerHTML=h}function renderCoursework(){const list=shown();$('courseworkList').innerHTML=list.length?`<table class="course-table"><thead><tr><th>上課日期／時間</th><th>學生姓名</th><th>家教科目</th><th>周考分數</th></tr></thead><tbody>${list.map(l=>`<tr class="course-row"><td>${l.lesson_date}<br><small>${l.start_time?.slice(0,5)||''}–${l.end_time?.slice(0,5)||''}</small></td><td>${esc(l.students?.name||'N/A')}</td><td>${esc(l.topic||'N/A')}</td><td><b>${esc(l.quiz_score||'N/A')}</b></td></tr><tr class="course-detail"><td colspan="4"><div class="notes"><div><b>教學進度</b>${esc(l.progress||'N/A')}</div><div><b>周考範圍</b>${esc(l.quiz_scope||'N/A')}</div><div><b>回家作業</b>${esc(l.homework||'N/A')}</div><div><b>老師觀察</b>${esc(l.teacher_observation||'N/A')}</div><div><b>家長回饋</b>N/A</div><div><b>下週考試</b>${esc(l.next_exam||'N/A')}</div></div></td></tr>`).join('')}</tbody></table>`:'<p class="empty">尚無課務紀錄。</p>'}function renderInvoice(month){const list=shown().filter(l=>l.lesson_date.startsWith(month)),student=students.find(s=>s.id===$('student').value),total=list.reduce((n,l)=>n+Number(l.hours)*Number(l.rate),0),hours=list.reduce((n,l)=>n+Number(l.hours),0);$('invoicePreview').innerHTML=`<article class="invoice"><header class="invoice-head"><h2>${Number(month.slice(5))} 月學費單</h2><p>福大自然家教管理系統｜BOSSFU TUTOR SYSTEM</p><p>學生：${esc(student?.name||'')}　｜　結算月份：${month}</p></header><div class="metrics"><div><b>${list.length}</b>課堂數</div><div><b>${hours}</b>累計時數</div><div><b>${money(total)}</b>本期費用</div></div><table><thead><tr><th>上課日期／時段</th><th>課程內容</th><th>時數</th><th>本次費用</th></tr></thead><tbody>${list.map(l=>`<tr><td>${l.lesson_date}<br><small>${l.start_time?.slice(0,5)||''}–${l.end_time?.slice(0,5)||''}</small></td><td>${esc(l.topic||'家教課程')}</td><td>${l.hours}</td><td>${money(Number(l.hours)*Number(l.rate))}</td></tr>`).join('')}</tbody></table><div class="amount">本期應繳金額　<b>${money(total)}</b></div><p class="muted" style="margin-top:18px">付款資訊請洽教師。</p></article>`}function renderInvoices(){const ms=months();$('invoiceChoices').innerHTML=ms.length?ms.map(m=>`<button data-invoice="${m}">${Number(m.slice(5))} 月學費單</button>`).join(''):'<span class="muted">尚無學費單。</span>';if(ms[0])renderInvoice(ms[0])}function renderFeedback(){const id=$('student').value,list=messages.filter(x=>x.student_id===id);$('feedbackList').innerHTML=list.length?list.map(x=>`<div class="message">${esc(x.body)}<small>${new Date(x.created_at).toLocaleString('zh-TW')}</small></div>`).join(''):'<p class="empty">尚無家長回饋。</p>'}function render(){renderCalendar();renderCoursework();renderInvoices();renderFeedback()}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view],.view').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.view).classList.add('active')});$('student').onchange=render;$('month').onchange=renderCalendar;document.addEventListener('click',e=>{const m=e.target.dataset.invoice;if(m)renderInvoice(m);const row=e.target.closest('.course-row');if(row){row.classList.toggle('open');row.nextElementSibling.classList.toggle('open')}});$('feedbackForm').onsubmit=async e=>{e.preventDefault();const body=$('feedbackBody').value.trim();if(!body||!session)return;const{error}=await db.from('messages').insert({student_id:$('student').value,author_id:session.user.id,body});$('feedbackNotice').textContent=error?'送出失敗，請稍後再試。':'已送出家長回饋。';if(!error){$('feedbackBody').value='';await load()}};async function load(){session=(await db.auth.getSession()).data.session;if(!session){document.querySelector('.wrap').innerHTML='<article class="card empty">請先登入後再查看家長資料。</article>';return}const[{data:s},{data:l},{data:m}]=await Promise.all([db.from('students').select('*').order('name'),db.from('lessons').select('*,students(name)').order('lesson_date',{ascending:false}),db.from('messages').select('*').order('created_at',{ascending:false})]);students=s||[];lessons=l||[];messages=m||[];if(!students.length){$('student').innerHTML='<option>尚無學生資料</option>';return}$('student').innerHTML=students.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');render()}load();</script></body></html>
