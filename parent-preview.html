<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>家長頁面預覽</title><style>body{margin:0;padding:22px;background:#f5f7fb;color:#1b2735;font:15px/1.6 system-ui,"PingFang TC",sans-serif}.card{max-width:850px;margin:auto;background:#fff;border:1px solid #dbe3ee;border-radius:14px;padding:20px}h1{font-size:22px;margin:0 0 5px}.muted{color:#657388}.lesson{padding:12px 0;border-bottom:1px solid #e0e6ee;white-space:pre-line}.lesson:last-child{border:0}select{padding:8px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}</style></head><body><main class="card"><h1>福大自然家教管理系統</h1><p class="muted">家長端預覽（唯讀）</p><label>學生　<select id="student"></select></label><div id="content" class="muted">載入中…</div></main><script src="supabase-config.js"></script><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const db=createClient(window.SUPABASE_CONFIG.url,window.SUPABASE_CONFIG.publishableKey),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let lessons=[];function render(){const id=$('student').value,list=lessons.filter(l=>l.student_id===id);$('content').innerHTML=list.length?list.map(l=>`<div class="lesson"><b>${l.lesson_date}　${esc(l.topic||'課程')}</b><br>${l.start_time?.slice(0,5)||''}–${l.end_time?.slice(0,5)||''}${l.progress?`<br>本堂進度：${esc(l.progress)}`:''}${l.homework?`<br>回家作業：${esc(l.homework)}`:''}${l.next_exam?`<br>下週考試：${esc(l.next_exam)}`:''}</div>`).join(''):'<p>尚無可顯示的課程資料。</p>'}async function load(){const session=(await db.auth.getSession()).data.session;if(!session){$('content').textContent='請從教師後台登入後使用此預覽。';return}const[{data:s},{data:l}]=await Promise.all([db.from('students').select('*').order('name'),db.from('lessons').select('*').order('lesson_date',{ascending:false})]);if(!s?.length){$('content').textContent='目前沒有可預覽的學生資料。';return}lessons=l||[];$('student').innerHTML=s.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');render()}$('student').onchange=render;load();</script></body></html>
