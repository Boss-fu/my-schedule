<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>家長端介面</title>
<link rel="stylesheet" href="theme.css?v=20260808165455">
<style>
/* ===== 家長端：閱讀導向版面，沿用同一套設計語言 ===== */
.wrap{max-width:1060px;margin:0 auto;padding:20px 18px 60px}
.head{background:#fff;border:1px solid var(--line);border-radius:var(--r-2xl);box-shadow:var(--shadow-sm);
  padding:20px 22px;display:flex;justify-content:space-between;gap:18px;align-items:end;flex-wrap:wrap;margin-bottom:14px}
.head h1{font-size:22px;font-weight:900;letter-spacing:-.02em}
.head p{margin-top:3px;font-size:14px}
.head label{display:grid;gap:5px;min-width:190px}

.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:2px;
  border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{position:relative;white-space:nowrap;flex:0 0 auto;border:0;background:none;
  border-bottom:2px solid transparent;color:var(--muted);font:inherit;font-size:14px;font-weight:700;
  padding:11px 14px;cursor:pointer;transition:color .15s,border-color .15s}
.tabs button:hover{color:var(--text)}
.tabs button.active{color:var(--tzu-red);border-bottom-color:var(--tzu-red)}

.view{display:none}.view.active{display:block}

/* 月曆 */
.week,.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.week{text-align:center;color:var(--muted);font-size:12px;font-weight:800;margin-bottom:6px}
.day{min-height:92px;border:1px solid var(--line);border-radius:var(--r-xl);padding:7px;background:#fff}
.day.other{opacity:.4;background:var(--surface-2)}
.day b{font-size:12px;font-weight:800;color:var(--text-2)}
.event.is-off{opacity:.5;text-decoration:line-through}
.event{margin-top:4px;padding:4px 6px;border-radius:6px;font-size:11px;font-weight:700;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;background:var(--bgc,#f1f5f9);color:var(--fgc,#334155)}
.cal-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;align-items:center}
.cal-legend:empty{display:none}
.cal-legend-title{flex-basis:100%;font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.06em;margin-bottom:2px}
.cal-legend-item{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--text-2)}
.cal-legend-item i{width:13px;height:13px;border-radius:4px;border:1px solid;flex:0 0 auto}

/* 課務展開表 */
.course-table{width:100%}
.course-row{cursor:pointer}
.course-row.open td{background:var(--surface-2)}
.course-detail{display:none}
.course-detail.open{display:table-row}
.course-detail td{background:var(--surface-2);padding-top:0}
.notes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.notes div{padding:11px 12px;background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);
  white-space:pre-line;font-size:13px;min-height:60px}
.notes b{display:block;margin-bottom:3px;color:var(--tzu-red);font-size:11px;font-weight:800}

/* 學費單 */
.invoice-choice{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.invoice-choice button{cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--text-2);
  border-radius:var(--r-lg);padding:9px 13px;font:inherit;font-size:14px;font-weight:700;min-height:38px}
.invoice-choice button:hover{background:var(--surface-2);color:var(--text)}
.invoice-choice button.active{background:var(--tzu-red);border-color:var(--tzu-red);color:#fff}
.invoice-choice button:disabled,.invoice-choice button.pending{opacity:.6;cursor:not-allowed;background:var(--surface-2);color:var(--muted)}
.invoice{max-width:820px;margin:16px auto;background:#fff;padding:26px;
  border:1px solid var(--line);border-radius:var(--r-2xl);box-shadow:var(--shadow-sm)}
.invoice-head{border-bottom:2px solid var(--tzu-red);padding-bottom:14px;margin-bottom:18px}
.invoice h2{font-size:24px;font-weight:900}
.metrics{display:flex;gap:10px;margin:15px 0}
.metrics div{flex:1;padding:12px;text-align:center;border-radius:var(--r-xl);background:var(--surface-2);
  border:1px solid var(--line);font-size:12px;font-weight:800;color:var(--muted)}
.metrics b{display:block;font-size:20px;font-weight:900;color:var(--text);margin-bottom:2px}
.amount{margin-top:16px;text-align:right;padding:15px 18px;border-radius:var(--r-xl);
  background:#fef2f2;border:1px solid #fecaca;font-size:17px;font-weight:800}
.amount b{font-size:24px;font-weight:900;color:var(--tzu-red);margin-left:10px}

/* 親師溝通 */
.feedback-list{display:grid;gap:9px;margin:14px 0}
.message{padding:12px 14px;border-radius:var(--r-xl);background:var(--surface-2);
  border:1px solid var(--line);white-space:pre-line;font-size:14px}
.message small{display:block;color:var(--muted);margin-top:5px;font-size:12px}
.message.from-teacher{background:#fffbeb;border-color:#fde68a}
.message.from-parent{background:#ecfdf5;border-color:#a7f3d0}
.feedback-form{display:grid;gap:9px;margin-top:16px;padding:15px;
  border:1px solid var(--line);border-radius:var(--r-xl);background:var(--surface-2)}
.feedback-form textarea{min-height:100px;background:#fff}
.feedback-form button{justify-self:start;border:1px solid var(--tzu-red);border-radius:var(--r-lg);
  background:var(--tzu-red);color:#fff;padding:9px 16px;font:inherit;font-size:14px;font-weight:700;
  cursor:pointer;min-height:38px}
.feedback-form button:hover{background:var(--tzu-red-hover)}

.detail{white-space:pre-line}

@media(max-width:650px){
  .wrap{padding:14px 12px 60px}
  .head{display:block;padding:16px}
  .head label{margin-top:12px}
  .card{padding:15px;border-radius:var(--r-xl)}
  .week,.calendar{gap:3px}
  .day{min-height:58px;padding:4px;border-radius:var(--r-lg)}
  /* 手機格子太小，改用色塊呈現，課程名稱看下方「顏色對照」 */
  .event{font-size:0;line-height:0;height:9px;padding:0;margin-top:3px;border-radius:3px}
  .metrics{display:grid;grid-template-columns:1fr;gap:8px}
  .notes{grid-template-columns:1fr}
  .invoice{padding:16px}
  /* 課務表格改為卡片式閱讀 */
  .course-table{min-width:0}
  .course-table thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .course-row{display:block;margin-bottom:8px;padding:12px 14px;background:#fff;
    border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--shadow-sm)}
  .course-row td{display:flex;justify-content:space-between;gap:12px;padding:6px 0;
    border:0;border-bottom:1px solid var(--line-soft);text-align:right}
  .course-row td:last-child{border-bottom:0}
  .course-row td::before{content:attr(data-label);color:var(--muted);font-size:12px;font-weight:800;text-align:left}
  /* 展開列改 block，避免收合後表格跑掉 */
  .course-detail.open{display:block;margin:-2px 0 8px}
  .course-detail td{display:block;padding:0}
  .notes div{font-size:12.5px;min-height:0}
}
</style></head>
<body><script>/* [臨時診斷] 迴圈偵測器：任一 MutationObserver 回呼在 800ms 內暴衝 >300 次，就自動 disconnect 並印出兇手函式。抓到後即可移除本段。 */(function(){var N=window.MutationObserver;if(!N||N.__bfw)return;function W(cb){var n=0,t=performance.now();function g(r,o){var w=performance.now();if(w-t>800){t=w;n=0;}if(++n>300){try{o.disconnect();}catch(e){}var s=String(cb).replace(/\s+/g,' ').slice(0,240);var m='🔴 抓到失控迴圈（已自動中斷）\n來源：'+location.pathname+'\n函式：'+s;try{localStorage.setItem('bossfu-loop',m);}catch(e){}try{console.error('[BOSSFU-LOOP]',m);}catch(e){}try{var b=document.createElement('div');b.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:2147483647;background:#b91c1c;color:#fff;font:12px/1.5 monospace;padding:12px 14px;white-space:pre-wrap;max-height:45vh;overflow:auto';b.textContent=m;(document.body||document.documentElement).appendChild(b);}catch(e){}return;}return cb.call(this,r,o);}return new N(g);}W.prototype=N.prototype;W.__bfw=1;window.MutationObserver=W;})();/* Avoid observer setup before an element exists. */(()=>{const observe=MutationObserver.prototype.observe;MutationObserver.prototype.observe=function(target,options){if(!target||typeof target.nodeType!=="number")return;return observe.call(this,target,options)}})();</script><main class="wrap"><header class="head"><div><h1>福大自然家教管理系統</h1><p class="muted">家長端｜課程資料與學費單</p></div><label>學生<select id="student"></select></label></header><nav class="tabs"><button class="active" data-view="calendar">課次與月曆</button><button data-view="coursework">學生課務</button><button data-view="invoice">學費單</button><button data-view="feedback">親師溝通</button></nav><section class="view active" id="calendar"><article class="card"><div class="filters"><label>月份<select id="month"></select></label></div><div class="week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div id="calendarGrid" class="calendar"></div><div id="calendarLegend" class="cal-legend"></div></article></section><section class="view" id="coursework"><article class="card"><h2>學生課務</h2><p class="muted">點選任何一堂課可展開完整內容；此頁資料為唯讀。</p><div id="courseworkList"></div></article></section><section class="view" id="invoice"><article class="card"><h2>學費單預覽</h2><p class="muted">點選月份即可直接預覽當月學費單。</p><div id="invoiceChoices" class="invoice-choice"></div><div id="invoicePreview"></div></article></section><section class="view" id="feedback"><article class="card"><h2>親師溝通／家長回饋</h2><p class="muted">課程資料均為唯讀；您可以在此留下回饋或問題。</p><div id="feedbackList" class="feedback-list"></div><form id="feedbackForm" class="feedback-form"><textarea id="feedbackBody" maxlength="2000" placeholder="請輸入想與老師溝通的內容…" required></textarea><button>送出家長回饋</button><span id="feedbackNotice" class="muted"></span></form></article></section></main>
<script>
/* 課程配色：12 色、不同課程一定不同色；keyColor / recolor / 圖例共用同一組，確保一致又不撞色。 */
window.BOSSFU_COURSE_PALETTE=[['#e1effd','#185995'],['#e5f5ef','#1a6f59'],['#fff0d8','#91570a'],['#f0e9fb','#6b479b'],['#fde9ed','#9c3d59'],['#e5f3f6','#176a7c'],['#eaf3d6','#4d6a12'],['#fce7f3','#9d2463'],['#e7e9fb','#3f3f9e'],['#fdeede','#a24b1e'],['#dcf1f0','#0f6b6b'],['#efe7d6','#7a5a2e']];
window.__bossfuCourseIdx={};window.__bossfuCourseNext=0;
window.bossfuCourseName=function(topic){return String(topic||'課程').replace(/\s+\d{1,2}:\d{2}$/,'').replace(/[　\s]+[0-9０-９].*$/,'').trim()||'課程';};
window.bossfuCourseColor=function(studentName,topic){var key=(studentName||'')+'｜'+window.bossfuCourseName(topic);if(!(key in window.__bossfuCourseIdx))window.__bossfuCourseIdx[key]=(window.__bossfuCourseNext++)%window.BOSSFU_COURSE_PALETTE.length;return window.BOSSFU_COURSE_PALETTE[window.__bossfuCourseIdx[key]];};
</script>
<script src="vendor/supabase.js?v=20260808165455"></script><script src="boot-check.js?v=20260808165455"></script><script src="supabase-config.js?v=20260808165455"></script><script type="module">const {createClient}=window.supabase;const db=(window.BOSSFU_DB ||= createClient(window.SUPABASE_CONFIG.url,window.SUPABASE_CONFIG.publishableKey)),$=id=>document.getElementById(id),money=n=>'NT$ '+Number(n||0).toLocaleString('zh-TW'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let students=[],lessons=[],messages=[],session=null;function keyColor(l){const x=window.bossfuCourseColor(l.students?.name,l.topic);return `--bgc:${x[0]};--fgc:${x[1]}`}const STATUS_LABEL={attended:'實到',leave:'請假',absent:'缺席'};const billable=list=>list.filter(l=>l.status==='attended');function shown(){return lessons.filter(l=>l.student_id===$('student').value)}function months(){return [...new Set(shown().map(l=>l.lesson_date.slice(0,7)))].sort().reverse()}function localDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function localMonth(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}function renderCalendar(){const ms=months(),m=$('month').value||ms[0]||localMonth(new Date());$('month').innerHTML=ms.map(x=>`<option value="${x}">${x}</option>`).join('')||'<option value="">尚無課次</option>';$('month').value=m;const[y,mo]=m.split('-').map(Number),start=new Date(y,mo-1,1-new Date(y,mo-1,1).getDay()),list=shown();let h='';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const iso=localDate(d),items=list.filter(l=>l.lesson_date===iso);h+=`<div class="day ${d.getMonth()!==mo-1?'other':''}"><b>${d.getDate()}</b>${items.map(l=>`<div class="event${l.status&&l.status!=='attended'?' is-off':''}" style="${keyColor(l)}" title="${esc(STATUS_LABEL[l.status]||'實到')}">${esc(l.topic||'N/A')} ${l.start_time?.slice(0,5)||''}</div>`).join('')}</div>`}$('calendarGrid').innerHTML=h;renderCalLegend()}
function renderCalLegend(){const box=$('calendarLegend');if(!box)return;const m=$('month').value,studentName=students.find(s=>s.id===$('student').value)?.name||'';const seen=new Set(),items=[];for(const l of shown()){if(m&&!l.lesson_date.startsWith(m))continue;const name=window.bossfuCourseName(l.topic);if(seen.has(name))continue;seen.add(name);const c=window.bossfuCourseColor(studentName,l.topic);items.push(`<span class="cal-legend-item"><i style="background:${c[0]};border-color:${c[1]}"></i>${esc(name)}</span>`)}box.innerHTML=items.length?'<span class="cal-legend-title">課程顏色對照</span>'+items.join(''):''}function renderCoursework(){const list=shown();$('courseworkList').innerHTML=list.length?`<table class="course-table"><thead><tr><th>上課日期／時間</th><th>學生姓名</th><th>家教科目</th><th>出席</th><th>周考分數</th></tr></thead><tbody>${list.map(l=>`<tr class="course-row"><td data-label="日期">${l.lesson_date}<br><small>${l.start_time?.slice(0,5)||''}–${l.end_time?.slice(0,5)||''}</small></td><td data-label="學生">${esc(l.students?.name||'N/A')}</td><td data-label="科目">${esc(l.topic||'N/A')}</td><td data-label="出席">${STATUS_LABEL[l.status]||'實到'}</td><td data-label="周考分數"><b>${esc(l.quiz_score||'N/A')}</b></td></tr><tr class="course-detail"><td colspan="5"><div class="notes"><div><b>教學進度</b>${esc(l.progress||'N/A')}</div><div><b>周考範圍</b>${esc(l.quiz_scope||'N/A')}</div><div><b>回家作業</b>${esc(l.homework||'N/A')}</div><div><b>老師觀察</b>${esc(l.teacher_observation||'N/A')}</div><div><b>家長回饋</b>N/A</div><div><b>下週考試</b>${esc(l.next_exam||'N/A')}</div></div></td></tr>`).join('')}</tbody></table>`:'<p class="empty">尚無課務紀錄。</p>'}function renderInvoice(month){const list=billable(shown().filter(l=>l.lesson_date.startsWith(month))),student=students.find(s=>s.id===$('student').value),total=list.reduce((n,l)=>n+Number(l.hours)*Number(l.rate),0),hours=list.reduce((n,l)=>n+Number(l.hours),0);$('invoicePreview').innerHTML=`<article class="invoice"><header class="invoice-head"><h2>${Number(month.slice(5))} 月 function renderInvoices(){const issued=window.__bossfuIssued||new Set(),ms=recentMonths(6);$('invoiceChoices').innerHTML=ms.map(m=>{const mm=Number(m.slice(5));return issued.has(m)?`<button data-invoice="${m}">${mm} 月學費單</button>`:`<button class="pending" disabled>${mm} 月：老師尚未開立</button>`}).join('');const firstIssued=ms.find(m=>issued.has(m));if(firstIssued)renderInvoice(firstIssued);else $('invoicePreview').innerHTML='<p class="empty">老師尚未開立學費單。</p>'}function renderFeedback(){/* 顯示改由 initPortal 的 refreshMessages 統一處理（含角色標籤與刪除鈕），此處不再覆寫 */}async function render(){renderCalendar();renderCoursework();await loadIssuedMonths();renderInvoices();renderFeedback()}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view],.view').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.view).classList.add('active')});$('student').onchange=render;$('month').onchange=renderCalendar;document.addEventListener('click',e=>{const m=e.target.dataset.invoice;if(m)renderInvoice(m);const row=e.target.closest('.course-row');if(row){row.classList.toggle('open');row.nextElementSibling.classList.toggle('open')}});$('feedbackForm').onsubmit=async e=>{e.preventDefault();const body=$('feedbackBody').value.trim();if(!body||!session)return;const{error}=await db.from('messages').insert({student_id:$('student').value,author_id:session.user.id,body,parent_id:session.user.id});$('feedbackNotice').textContent=error?'送出失敗，請稍後再試。':'已送出家長回饋。';if(!error){$('feedbackBody').value='';try{await db.functions.invoke('send-push',{body:{target_role:'teacher',title:'家長回饋',body,url:'/teacher'}})}catch(_){}await load()}};function signInNotice(show){let el=document.getElementById('previewSignIn');if(!show){el?.remove();return}if(el)return;el=document.createElement('article');el.id='previewSignIn';el.className='card empty';el.textContent='正在讀取登入狀態…若持續顯示，請重新登入後再試。';document.querySelector('.wrap')?.prepend(el);}async function load(){session=(await db.auth.getSession()).data.session;if(!session){signInNotice(true);return}signInNotice(false);const[{data:s},{data:l},{data:m}]=await Promise.all([db.from('students').select('*').order('name'),db.from('lessons').select('*,students(name)').order('lesson_date',{ascending:false}),db.from('messages').select('*').order('created_at',{ascending:false})]);students=s||[];lessons=l||[];messages=m||[];if(!students.length){$('student').innerHTML='<option>尚無學生資料</option>';return}$('student').innerHTML=students.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');render()}load();db.auth.onAuthStateChange((_event,s)=>{if(s&&!session)setTimeout(load,0)});</script></body></html>

<script type="module">
  const {createClient}=window.supabase;

  const {createClient}=window.supabase;
  const uploadDb=(window.BOSSFU_DB ||= createClient(window.SUPABASE_CONFIG.url,window.SUPABASE_CONFIG.publishableKey));
  async function bindReliableUpload(){
    const form=document.getElementById('examUploadForm'),input=document.getElementById('examFile');
    if(!form||!input||form.dataset.reliableUpload)return false;
    form.dataset.reliableUpload='true';
    form.onsubmit=async event=>{
      event.preventDefault();
      const file=input.files?.[0],studentId=document.getElementById('student')?.value,notice=document.getElementById('examUploadNotice');
      if(!file||!studentId){notice.textContent='請先選擇檔案與學生。';return;}
            if(!['application/pdf','image/jpeg','image/png'].includes(file.type)){notice.textContent='只支援 PDF、JPG 或 PNG。';return;}
      let session=(await uploadDb.auth.getSession()).data.session;
      const parentSession=window.parent!==window?window.parent.BOSSFU_AUTH_SESSION:null;
      if(!session&&parentSession?.access_token&&parentSession?.refresh_token){session=(await uploadDb.auth.setSession(parentSession)).data.session;}
      if(!session){notice.textContent='登入資訊已逾時，請先登出後重新登入。';return;}
      // Storage object key 僅使用安全英數字元；原始中文檔名仍記錄在資料表供老師閱讀。
      const extension=(file.name.match(/\.[A-Za-z0-9]+$/)?.[0]||'').toLowerCase();
      const clean='exam_paper'+extension,path=studentId+'/'+Date.now()+'_'+clean;
      notice.textContent='上傳中…';
      const {error:uploadError}=await uploadDb.storage.from('exam-papers').upload(path,file,{contentType:file.type,upsert:false});
      if(uploadError){notice.textContent='上傳失敗：'+uploadError.message;return;}
      const {error:recordError}=await uploadDb.from('student_files').insert({student_id:studentId,uploader_id:session.user.id,file_name:file.name,storage_path:path,parent_id:session.user.id});
      if(recordError){notice.textContent='檔案已上傳，但登錄失敗：'+recordError.message;return;}
      notice.textContent='已上傳，老師可在學生課務查看。';form.reset();
    };

  }

  async function refreshMessages(){const id=studentPicker.value;if(!id)return;const{data}=await portalDb.from('messages').select('id,body,author_role,created_at').eq('student_id',id).order('created_at',{ascending:false});const canDel=portalRole==='teacher';document.getElementById('feedbackList').innerHTML=(data||[]).length?(data||[]).map(m=>'<div class="message"><b>'+(m.author_role==='teacher'?'老師回饋':'家長回饋')+'</b>'+(canDel?' <button class="btn danger" type="button" data-del-msg="'+m.id+'" style="float:right;padding:2px 9px;min-height:0;font-size:12px">刪除</button>':'')+'<br>'+safe(m.body)+'<small>'+new Date(m.created_at).toLocaleString('zh-TW')+'</small></div>').join(''):'<p class="empty">尚無親師訊息。</p>'}
  async function initPortal(){const{data:{session}}=await portalDb.auth.getSession();if(!session)return;const{data:profile}=await portalDb.from('profiles').select('role').eq('id',session.user.id).single();portalRole=profile?.role||'parent';if(portalRole==='teacher'){document.querySelector('#feedback h2').textContent='老師回饋';document.querySelector('#feedback .muted').textContent='此處送出的內容會標記為老師回饋；學生資料維持唯讀。';feedbackForm.querySelector('textarea').placeholder='請輸入要提供給家長的回饋…';feedbackForm.querySelector('button').textContent='送出老師回饋';}else{ /* 檔案中心由新版模組統一建立。 */ }await refreshMessages();studentPicker.addEventListener('change',()=>setTimeout(refreshMessages,250));document.addEventListener('click',async ev=>{const btn=ev.target.closest('[data-del-msg]');if(!btn)return;if(!confirm('確定刪除這則留言？此操作無法復原。'))return;const {error}=await portalDb.from('messages').delete().eq('id',btn.dataset.delMsg);if(error){alert('刪除失敗：'+error.message);return}await refreshMessages()});document.addEventListener('submit',async e=>{if(e.target!==feedbackForm)return;if(portalRole==='teacher'){e.preventDefault();e.stopImmediatePropagation();const body=document.getElementById('feedbackBody').value.trim();if(!body)return;const{error}=await portalDb.from('messages').insert({student_id:studentPicker.value,author_id:session.user.id,body,author_role:'teacher',parent_id:window.__bossfuPreviewParentId||null});document.getElementById('feedbackNotice').textContent=error?'送出失敗：'+error.message:'已送出老師回饋。';if(!error){document.getElementById('feedbackBody').value='';try{await portalDb.functions.invoke('send-push',{body:{target_user_ids:[window.__bossfuPreviewParentId],title:'老師回饋',body,url:'/parent'}})}catch(_){}await refreshMessages()}}else setTimeout(refreshMessages,800)},true)}
  setTimeout(initPortal,1000);
</script>
<script type="module">
  const {createClient}=window.supabase;
  const logoutDb=(window.BOSSFU_DB ||= createClient(window.SUPABASE_CONFIG.url,window.SUPABASE_CONFIG.publishableKey));
  async function addParentLogout(){
    const {data:{session}}=await logoutDb.auth.getSession();
    if(!session)return;
    const {data:profile}=await logoutDb.from('profiles').select('role').eq('id',session.user.id).single();
    if(profile?.role!=='parent')return;
    const head=document.querySelector('.head');
    if(!head||document.getElementById('parentLogout'))return;
    const button=document.createElement('button');
    button.id='parentLogout';button.type='button';button.textContent='登出';
    button.style.cssText='border:1px solid #e2e8f0;border-radius:8px;background:#fff;color:#64748b;padding:8px 12px;font:700 14px system-ui;cursor:pointer';
    button.onclick=async()=>{button.disabled=true;button.textContent='登出中…';await logoutDb.auth.signOut();location.replace('parent.html');};
    head.append(button);
  }
  setTimeout(addParentLogout,900);
</script>
<script>
  (function(){
    const style=document.createElement('style');
    style.textContent='.exam-dropzone{margin:8px 0;border:2px dashed #cbd5e1;border-radius:12px;background:#f8fafc;padding:24px 16px;text-align:center;color:#850103;font-weight:800;cursor:pointer;transition:.15s}.exam-dropzone.drag{border-color:#850103;background:#e9f5ff}.exam-dropzone small{display:block;margin-top:5px;color:#64748b;font-weight:500}';
    document.head.append(style);
    function setupUpload(){
      const input=document.getElementById('examFile');
      if(!input||input.dataset.dragReady)return false;
      input.dataset.dragReady='true';input.style.display='none';
      const zone=document.createElement('div');zone.className='exam-dropzone';zone.tabIndex=0;zone.innerHTML='拖拉段考卷到這裡，或點擊選擇檔案<small>支援 PDF、JPG、PNG</small>';
      input.insertAdjacentElement('beforebegin',zone);
      const describe=()=>{const file=input.files?.[0];if(file)zone.innerHTML='已選擇：'+file.name+'<small>按下「上傳段考卷」即可送出；可再點擊或拖拉檔案更換。</small>';};
      zone.onclick=()=>input.click();zone.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();input.click();}};
      input.addEventListener('change',describe);
      ['dragenter','dragover'].forEach(type=>zone.addEventListener(type,e=>{e.preventDefault();zone.classList.add('drag')}));
      ['dragleave','drop'].forEach(type=>zone.addEventListener(type,e=>{e.preventDefault();zone.classList.remove('drag')}));
      zone.addEventListener('drop',e=>{if(!e.dataTransfer.files?.length)return;input.files=e.dataTransfer.files;input.dispatchEvent(new Event('change',{bubbles:true}));});
      return true;
    }
    const timer=setInterval(()=>{if(setupUpload())clearInterval(timer)},250);
    setTimeout(()=>{document.querySelector('[data-view="feedback"]')?.replaceChildren('親師溝通');const heading=document.querySelector('#feedback h2');if(heading)heading.textContent='親師溝通';const button=document.querySelector('#feedbackForm button');if(button)button.textContent='送出訊息';},900);
  })();
</script>
<script type="module">
  /* Loaded last so this captures submit before legacy inline handlers. */
  const {createClient}=window.supabase;
  const safeUploadDb=(window.BOSSFU_DB ||= createClient(window.SUPABASE_CONFIG.url,window.SUPABASE_CONFIG.publishableKey));
  async function uploadExamPaper(form){
    const file=document.getElementById('examFile')?.files?.[0],studentId=document.getElementById('student')?.value,notice=document.getElementById('examUploadNotice');
    if(!file||!studentId||!notice)return;
        const ext=(file.name.match(/\.([a-z0-9]+)$/i)?.[1]||'').toLowerCase(),allowed=['pdf','jpg','jpeg','png','doc','docx','ppt','pptx','xls','xlsx'];
    if(!allowed.includes(ext)){notice.textContent='請上傳 PDF、圖片或常用 Office 文件。';return;}
    notice.textContent='上傳中…';
    let {data:{session}}=await safeUploadDb.auth.getSession();
    const parentSession=window.parent!==window?window.parent.BOSSFU_AUTH_SESSION:null;
    if(!session&&parentSession?.access_token){await safeUploadDb.auth.setSession(parentSession);({data:{session}}=await safeUploadDb.auth.getSession());}
    if(!session?.user){notice.textContent='登入已逾期，請重新登入後再上傳。';return;}
    const path=studentId+'/'+Date.now()+'_parent_upload.'+ext;
    const {error:uploadError}=await safeUploadDb.storage.from('exam-papers').upload(path,file,{contentType:file.type,upsert:false});
    if(uploadError){notice.textContent='上傳失敗：'+uploadError.message;return;}
    const {error:recordError}=await safeUploadDb.from('student_files').insert({student_id:studentId,uploader_id:session.user.id,file_name:file.name,storage_path:path,parent_id:session.user.id});
    if(recordError){await safeUploadDb.storage.from('exam-papers').remove([path]);notice.textContent='資料儲存失敗：'+recordError.message;return;}
    notice.textContent='已上傳，老師可在檔案中心查看。';form.reset();document.dispatchEvent(new Event('bossfu-file-uploaded'));
  }
  document.addEventListener('submit',event=>{const form=event.target;if(form?.id!=='examUploadForm')return;event.preventDefault();event.stopImmediatePropagation();uploadExamPaper(form);},true);
</script>
