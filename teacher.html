<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>教師端｜課務管理</title>
  <style>
    :root{--bg:#f4f6f9;--surface:#fff;--surface2:#eef1f6;--border:#dce1ea;--text:#1c222c;--muted:#647084;--accent:#2f7fce;--ok:#2f9079;--radius:14px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 "PingFang TC","Noto Sans TC",system-ui,sans-serif}.shell{min-height:100vh;display:grid;grid-template-columns:235px 1fr}.side{background:#182431;color:#e8eef7;padding:20px 12px;position:sticky;top:0;height:100vh}.brand{font-weight:800;font-size:19px;padding:5px 10px 20px}.brand small{display:block;font-size:12px;color:#a7b5c5;font-weight:500}.nav{display:grid;gap:4px}.nav button{appearance:none;border:0;border-radius:9px;background:transparent;color:#c4d0dd;text-align:left;padding:10px 12px;font:inherit;cursor:pointer}.nav button:hover,.nav button.active{background:#29435b;color:#fff}.nav .sep{height:1px;background:#314456;margin:10px 7px}.content{padding:28px clamp(18px,4vw,46px);max-width:1300px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:start;gap:16px;margin-bottom:23px}h1{font-size:26px;margin:0}h2{font-size:18px;margin:0 0 5px}h3{font-size:15px;margin:0 0 4px}.hint,.muted{color:var(--muted)}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:19px;margin-bottom:15px;box-shadow:0 3px 16px rgba(25,40,70,.05)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.metric{background:var(--surface2);border-radius:11px;padding:14px}.metric b{font-size:25px;display:block}.metric span{font-size:12px;font-weight:700;color:var(--muted)}.view{display:none}.view.active{display:block}.lesson{display:grid;grid-template-columns:110px 1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);align-items:start}.lesson:last-child{border:0}.tag{font-size:12px;font-weight:700;color:var(--ok)}.btn{display:inline-block;text-decoration:none;border:1px solid var(--border);color:var(--text);background:var(--surface);border-radius:9px;padding:8px 11px;font-weight:700;font-size:13px}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 7px;border-bottom:1px solid var(--border);vertical-align:top}th{font-size:12px;color:var(--muted)}.empty{color:var(--muted);padding:20px;text-align:center}@media(max-width:800px){.shell{grid-template-columns:1fr}.side{position:static;height:auto;padding:12px}.brand{padding-bottom:8px}.nav{grid-template-columns:repeat(3,1fr)}.nav .sep{display:none}.nav button{font-size:13px;padding:8px}.content{padding:20px 14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.lesson{grid-template-columns:1fr}.lesson>span:last-child{display:none}}
  </style>
</head>
<body>
  <div class="shell"><aside class="side"><div class="brand">我的班表<small>教師課務管理</small></div><nav class="nav" id="nav"><button class="active" data-view="home">首頁</button><button data-view="courses">課務</button><button data-view="students">學生</button><button data-view="finance">財務</button><button data-view="service">家長服務</button><span class="sep"></span><button data-view="admin">管理</button><a class="btn" href="index.html">回個人班表</a></nav></aside>
  <main class="content"><div class="top"><div><h1 id="title">首頁</h1><div class="hint" id="subtitle">今日課程、待辦與本月收入</div></div><a class="btn primary" href="tutoring.html">新增／修改課次</a></div>
    <section class="view active" id="home"><div class="grid" id="metrics"></div><div class="card"><h2>近期課程</h2><div id="recent"></div></div></section>
    <section class="view" id="courses"><div class="card"><h2>課務總覽</h2><p class="hint">課次新增、修改、請假與補課作業可從家教帳務頁進行。</p><a class="btn primary" href="tutoring.html">開啟課務登錄</a></div><div class="card"><h2>所有已同步課次</h2><div id="courseList"></div></div></section>
    <section class="view" id="students"><div class="card"><h2>學生名單</h2><p class="hint">顯示已同步至課務系統的學生與預設時薪。</p><div id="studentList"></div></div></section>
    <section class="view" id="finance"><div class="card"><h2>本月財務</h2><p class="hint">以實到課次統計；完整學費單可由家教帳務頁輸出。</p><div class="grid" id="financeMetrics"></div><a class="btn primary" href="tutoring.html">開啟學費單</a></div></section>
    <section class="view" id="service"><div class="card"><h2>家長服務</h2><p class="hint">家長端將提供課程明細、教學進度、講義與親師訊息。</p><a class="btn" href="parent.html">預覽家長端</a></div></section>
    <section class="view" id="admin"><div class="card"><h2>帳號與權限</h2><p class="hint">教師帳號已受登入保護。下一步可在此建立家長帳號、指派學生與管理講義權限。</p><div id="adminInfo" class="muted">載入帳號資料中…</div></div></section>
  </main></div>
  <script src="supabase-config.js"></script><script type="module" src="auth.js"></script>
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
    const db=createClient(window.SUPABASE_CONFIG.url,window.SUPABASE_CONFIG.publishableKey),month=new Date().toISOString().slice(0,7),money=n=>'NT$ '+Number(n||0).toLocaleString('zh-TW');
    function lessonRow(l){const student=l.students?.name||'未指定學生',topic=l.topic||'未填寫課程主題';return '<div class="lesson"><span>'+l.lesson_date+'<br><small>'+(l.start_time&&l.end_time?l.start_time.slice(0,5)+'–'+l.end_time.slice(0,5):'')+'</small></span><span><b>'+student+'</b><br>'+topic+'</span><span class="tag">'+(l.status==='attended'?'實到':l.status==='leave'?'請假':'缺席')+'</span></div>'}
    async function load(){const session=(await db.auth.getSession()).data.session;if(!session)return;const [{data:students},{data:lessons},{data:profile}]=await Promise.all([db.from('students').select('*').order('name'),db.from('lessons').select('*,students(name)').order('lesson_date',{ascending:false}),db.from('profiles').select('display_name').eq('id',session.user.id).single()]);const all=lessons||[],paid=all.filter(x=>x.status==='attended'),thisMonth=paid.filter(x=>x.lesson_date.startsWith(month)),income=thisMonth.reduce((n,x)=>n+Number(x.hours)*Number(x.rate),0),hours=thisMonth.reduce((n,x)=>n+Number(x.hours),0);document.getElementById('metrics').innerHTML='<div class="metric"><b>'+thisMonth.length+'</b><span>本月實到堂數</span></div><div class="metric"><b>'+hours+'</b><span>本月實到時數</span></div><div class="metric"><b>'+money(income)+'</b><span>本月課堂收入</span></div><div class="metric"><b>'+(students||[]).length+'</b><span>學生人數</span></div>';document.getElementById('recent').innerHTML=all.length?all.slice(0,6).map(lessonRow).join(''):'<p class="empty">尚無已同步課次。</p>';document.getElementById('courseList').innerHTML=all.length?all.map(lessonRow).join(''):'<p class="empty">尚無已同步課次。</p>';document.getElementById('studentList').innerHTML=(students||[]).length?'<table><thead><tr><th>學生</th><th>預設時薪</th></tr></thead><tbody>'+students.map(s=>'<tr><td>'+s.name+'</td><td>'+money(s.default_rate)+'</td></tr>').join('')+'</tbody></table>':'<p class="empty">尚無學生資料。</p>';document.getElementById('financeMetrics').innerHTML='<div class="metric"><b>'+money(income)+'</b><span>'+month+' 總收入</span></div><div class="metric"><b>'+hours+'</b><span>實到時數</span></div>';document.getElementById('adminInfo').textContent='目前登入：'+(profile?.display_name||'教師')+'。';}
    const labels={home:['首頁','今日課程、待辦與本月收入'],courses:['課務','課次、課表、請假與補課'],students:['學生','學生名單與家長關聯'],finance:['財務','學費單與當月收入'],service:['家長服務','教學報告、講義與親師訊息'],admin:['管理','帳號與權限']};document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#nav button,.view').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.view).classList.add('active');document.getElementById('title').textContent=labels[b.dataset.view][0];document.getElementById('subtitle').textContent=labels[b.dataset.view][1]});db.auth.onAuthStateChange((_e,s)=>{if(s)setTimeout(load,0)});load();
  </script>
</body></html>
