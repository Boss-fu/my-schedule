<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>福大自然家教管理系統｜BOSSFU TUTOR SYSTEM</title>
  <style>
    :root{--bg:#f4f6f9;--card:#fff;--sub:#edf2f7;--line:#dce3ec;--text:#1a2533;--muted:#657388;--blue:#2d7dcc;--dark:#182431;--green:#29806c;--warn:#a76a16}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 "PingFang TC","Noto Sans TC",system-ui,sans-serif}.shell{min-height:100vh;display:grid;grid-template-columns:230px 1fr}.side{background:var(--dark);padding:22px 12px;color:#e9f0f8;position:sticky;top:0;height:100vh}.brand{padding:4px 11px 22px;font-weight:800;font-size:18px}.brand small{display:block;color:#aab9c9;font-size:11px;letter-spacing:.08em}.nav{display:grid;gap:5px}.nav button{border:0;border-radius:9px;background:transparent;color:#c6d2df;padding:10px 12px;text-align:left;font:inherit;cursor:pointer}.nav button.active,.nav button:hover{color:#fff;background:#29435b}.content{width:min(1380px,100%);margin:auto;padding:28px clamp(16px,4vw,46px)}.top{display:flex;justify-content:space-between;align-items:start;gap:14px;margin-bottom:20px}h1{margin:0;font-size:27px}h2{font-size:18px;margin:0 0 5px}h3{font-size:15px;margin:0}.muted{color:var(--muted)}.view{display:none}.view.active{display:block}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 3px 14px rgba(22,40,70,.04)}.metric{background:var(--sub);border-radius:11px;padding:14px}.metric b{font-size:25px;display:block}.metric span,label{font-size:12px;font-weight:700;color:var(--muted)}.twocol{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}.filters,.formgrid{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.filters label,.formgrid label{display:grid;gap:4px;min-width:130px;flex:1}input,select,textarea{border:1px solid #cbd5e1;border-radius:8px;padding:8px;font:inherit;background:#fff;color:var(--text)}textarea{min-height:74px;resize:vertical}.btn{border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);padding:8px 11px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}.btn.primary{color:#fff;background:var(--blue);border-color:var(--blue)}.btn.danger{color:#a73932}.lesson{display:grid;grid-template-columns:105px 1fr auto;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.lesson:last-child{border:0}.status{font-size:12px;color:var(--green);font-weight:800}.calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.week,.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.week{font-size:12px;color:var(--muted);text-align:center;margin-bottom:5px}.day{min-height:108px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:6px}.day.other{opacity:.36;background:var(--sub)}.daynum{font-size:12px;font-weight:700}.event{display:block;width:100%;margin-top:4px;padding:3px 5px;border:0;border-radius:5px;text-align:left;background:#e1effd;color:#185995;font-size:11px;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.event.leave{background:#fff1db;color:#8a570f}.event.absent{background:#fde7e7;color:#9c3737}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 6px;vertical-align:top;border-bottom:1px solid var(--line)}th{font-size:12px;color:var(--muted)}.detail{white-space:pre-line;font-size:13px}.empty{padding:22px;text-align:center;color:var(--muted)}.hide{display:none!important}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{position:static;height:auto}.nav{grid-template-columns:repeat(4,1fr)}.nav button{text-align:center;font-size:13px}.content{padding:20px 14px}.cards{grid-template-columns:repeat(2,1fr)}.twocol{grid-template-columns:1fr}.day{min-height:83px}.lesson{grid-template-columns:1fr}.calendar{gap:3px}.event{font-size:10px}}@media(max-width:560px){.cards{grid-template-columns:1fr}.week,.calendar{gap:2px}.day{padding:3px;min-height:68px}.event{padding:2px}.top{display:block}.top .btn{margin-top:10px}}
  </style>
</head>
<body>
<div class="shell"><aside class="side"><div class="brand">福大自然家教<small>BOSSFU TUTOR SYSTEM</small></div><nav class="nav" id="nav"><button class="active" data-view="home">首頁</button><button data-view="lessons">課次</button><button data-view="coursework">課務</button><button data-view="finance">財務</button></nav></aside>
<main class="content"><div class="top"><div><h1 id="title">首頁</h1><div class="muted" id="subtitle">本月課務與收入總覽</div></div><button class="btn primary" id="openLesson">＋ 新增課次</button></div>
<section class="view active" id="home"><div class="cards" id="dashboard"></div><div class="twocol"><div class="card"><h2>近期課程</h2><div id="recent"></div></div><div class="card"><h2>快速入口</h2><p class="muted">所有課次、學生進度與財務資料都在這個後台管理。</p><button class="btn" data-go="lessons">查看月曆課次</button> <button class="btn" data-go="coursework">填寫課務紀錄</button></div></div></section>
<section class="view" id="lessons"><div class="card"><div class="calendar-head"><button class="btn" id="prevMonth">←</button><h2 id="calendarTitle"></h2><button class="btn" id="nextMonth">→</button></div><div class="week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div class="calendar" id="calendar"></div></div><div class="card"><h2>個別學生課次明細</h2><div class="filters"><label>月份<input type="month" id="lessonMonth"></label><label>學生<select id="lessonStudent"></select></label><button class="btn" id="clearLessonFilter">顯示全部</button></div><div id="lessonList"></div></div><div class="card hide" id="lessonEditor"><div class="calendar-head"><h2 id="editorTitle">新增課次</h2><button class="btn" id="closeEditor">收起</button></div><form id="lessonForm"><input type="hidden" id="lessonId"><div class="formgrid"><label>學生<select id="formStudent" required></select></label><label>日期<input type="date" id="formDate" required></label><label>開始<input type="time" id="formStart" required></label><label>結束<input type="time" id="formEnd" required></label><label>時數<input type="number" id="formHours" min=".5" step=".5" required></label><label>時薪<input type="number" id="formRate" min="0" step="100" required></label><label>出缺勤<select id="formStatus"><option value="attended">實到</option><option value="leave">請假</option><option value="absent">缺席</option></select></label></div><div class="formgrid"><label>課程主題<input id="formTopic"></label><label>周考範圍<input id="formScope"></label><label>周考成績<input id="formScore"></label><label>下週考試<input id="formExam"></label></div><div class="formgrid"><label>每節課進度<textarea id="formProgress"></textarea></label><label>老師觀察<textarea id="formObservation"></textarea></label><label>回家作業<textarea id="formHomework"></textarea></label></div><p><button class="btn primary" type="submit">儲存課次</button> <button class="btn" type="button" id="resetForm">取消修改</button></p></form></div></section>
<section class="view" id="coursework"><div class="card"><h2>個別學生課務</h2><div class="filters"><label>學生<select id="workStudent"></select></label><button class="btn" id="openStudentLesson">＋ 為此學生新增課次</button></div><div id="courseworkList"></div></div></section>
<section class="view" id="finance"><div class="card"><h2>學費與收入</h2><div class="filters"><label>月份<input type="month" id="financeMonth"></label><label>學生<select id="financeStudent"></select></label><button class="btn" id="clearFinanceFilter">全部學生</button></div><div class="cards" id="financeCards"></div></div><div class="card"><h2>收費明細</h2><div id="financeTable"></div></div></section>
</main></div>
<script src="supabase-config.js"></script><script type="module" src="auth.js"></script>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const db=createClient(window.SUPABASE_CONFIG.url,window.SUPABASE_CONFIG.publishableKey);let students=[],lessons=[],shownMonth=new Date().toISOString().slice(0,7);const $=id=>document.getElementById(id),money=n=>'NT$ '+Number(n||0).toLocaleString('zh-TW'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const studentOptions=(blank=true)=>`${blank?'<option value="">全部學生</option>':''}${students.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}`;
function status(l){return l.status==='attended'?'實到':l.status==='leave'?'請假':'缺席'}function row(l,full=false){const more=full?`<div class="detail">${l.quiz_scope?`周考範圍：${esc(l.quiz_scope)}　` :''}${l.quiz_score?`成績：${esc(l.quiz_score)}\n`:''}${l.progress?`進度：${esc(l.progress)}\n`:''}${l.teacher_observation?`老師觀察：${esc(l.teacher_observation)}\n`:''}${l.homework?`回家作業：${esc(l.homework)}\n`:''}${l.next_exam?`下週考試：${esc(l.next_exam)}`:''}</div>`:'';return `<div class="lesson"><span>${l.lesson_date}<br><small>${l.start_time?.slice(0,5)||''}–${l.end_time?.slice(0,5)||''}</small></span><span><b>${esc(l.students?.name||'未指定學生')}</b>　${esc(l.topic||'未填寫主題')}${more}</span><span><span class="status">${status(l)}</span><br><button class="btn edit" data-id="${l.id}">修改</button></span></div>`}
function filtered(month,studentId){return lessons.filter(l=>(!month||l.lesson_date.startsWith(month))&&(!studentId||l.student_id===studentId))}
function renderSelects(){['lessonStudent','workStudent','financeStudent'].forEach(id=>{const keep=$(id).value;$(id).innerHTML=studentOptions(true);$(id).value=keep});$('formStudent').innerHTML=studentOptions(false)}
function renderHome(){const month=shownMonth,all=filtered(month,''),paid=all.filter(l=>l.status==='attended'),income=paid.reduce((a,l)=>a+Number(l.hours)*Number(l.rate),0),hours=paid.reduce((a,l)=>a+Number(l.hours),0);$('dashboard').innerHTML=`<div class="metric"><b>${paid.length}</b><span>${month} 實到堂數</span></div><div class="metric"><b>${hours}</b><span>實到時數</span></div><div class="metric"><b>${money(income)}</b><span>課堂收入</span></div><div class="metric"><b>${students.length}</b><span>學生人數</span></div>`;$('recent').innerHTML=lessons.length?lessons.slice(0,6).map(l=>row(l)).join(''):'<p class="empty">尚無課次。</p>'}
function renderCalendar(){const [y,m]=shownMonth.split('-').map(Number),first=new Date(y,m-1,1),start=new Date(y,m-1,1-first.getDay()),last=new Date(y,m,0).getDate();$('calendarTitle').textContent=`${y} 年 ${m} 月`;let html='';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const iso=d.toISOString().slice(0,10),items=lessons.filter(l=>l.lesson_date===iso);html+=`<div class="day ${d.getMonth()!==m-1?'other':''}"><div class="daynum">${d.getDate()}</div>${items.map(l=>`<button class="event ${l.status}" data-id="${l.id}">${esc(l.students?.name)}・${esc(l.topic||'課次')}</button>`).join('')}</div>`}$('calendar').innerHTML=html}
function renderLessons(){const list=filtered($('lessonMonth').value,$('lessonStudent').value);$('lessonList').innerHTML=list.length?list.map(l=>row(l)).join(''):'<p class="empty">此條件尚無課次。</p>'}
function renderCoursework(){const id=$('workStudent').value;if(!id){$('courseworkList').innerHTML='<p class="empty">請先選擇學生，查看每節課的進度、觀察、作業與周考。</p>';return}const list=filtered('',id);$('courseworkList').innerHTML=list.length?list.map(l=>row(l,true)).join(''):'<p class="empty">此學生尚無課務紀錄。</p>'}
function renderFinance(){const list=filtered($('financeMonth').value,$('financeStudent').value),paid=list.filter(l=>l.status==='attended'),income=paid.reduce((a,l)=>a+Number(l.hours)*Number(l.rate),0),hours=paid.reduce((a,l)=>a+Number(l.hours),0);$('financeCards').innerHTML=`<div class="metric"><b>${money(income)}</b><span>實到總收入</span></div><div class="metric"><b>${hours}</b><span>實到時數</span></div><div class="metric"><b>${paid.length}</b><span>已完成課次</span></div><div class="metric"><b>${list.length-paid.length}</b><span>請假／缺席</span></div>`;$('financeTable').innerHTML=list.length?`<table><thead><tr><th>日期</th><th>學生</th><th>課程</th><th>時數</th><th>時薪</th><th>金額</th><th>狀態</th></tr></thead><tbody>${list.map(l=>`<tr><td>${l.lesson_date}</td><td>${esc(l.students?.name)}</td><td>${esc(l.topic)}</td><td>${l.hours}</td><td>${money(l.rate)}</td><td>${money(l.status==='attended'?Number(l.hours)*Number(l.rate):0)}</td><td>${status(l)}</td></tr>`).join('')}</tbody></table>`:'<p class="empty">此條件尚無收費資料。</p>'}
function render(){renderSelects();$('lessonMonth').value=shownMonth;$('financeMonth').value=shownMonth;renderHome();renderCalendar();renderLessons();renderCoursework();renderFinance()}
function openEdit(l){$('lessonEditor').classList.remove('hide');$('editorTitle').textContent=l?'修改課次':'新增課次';$('lessonForm').reset();$('lessonId').value=l?.id||'';$('formStudent').value=l?.student_id||$('workStudent').value||students[0]?.id||'';$('formDate').value=l?.lesson_date||new Date().toISOString().slice(0,10);$('formStart').value=l?.start_time?.slice(0,5)||'19:00';$('formEnd').value=l?.end_time?.slice(0,5)||'21:00';$('formHours').value=l?.hours||2;$('formRate').value=l?.rate||students.find(s=>s.id===$('formStudent').value)?.default_rate||0;$('formStatus').value=l?.status||'attended';$('formTopic').value=l?.topic||'';$('formScope').value=l?.quiz_scope||'';$('formScore').value=l?.quiz_score||'';$('formExam').value=l?.next_exam||'';$('formProgress').value=l?.progress||'';$('formObservation').value=l?.teacher_observation||'';$('formHomework').value=l?.homework||'';$('lessonEditor').scrollIntoView({behavior:'smooth',block:'start'})}
async function load(){const session=(await db.auth.getSession()).data.session;if(!session)return;const [{data:s,error:se},{data:l,error:le}]=await Promise.all([db.from('students').select('*').order('name'),db.from('lessons').select('*,students(name)').order('lesson_date',{ascending:false})]);if(se||le){alert('資料載入失敗，請重新整理。');return}students=s||[];lessons=l||[];render()}
const titles={home:['首頁','本月課務與收入總覽'],lessons:['課次','月曆與個別學生課次明細'],coursework:['課務','周考、進度、觀察、作業與下週考試'],finance:['財務','個別學生與全部學生的收入彙總']};function go(view){document.querySelectorAll('.view,.nav button').forEach(x=>x.classList.remove('active'));$ (view).classList.add('active');document.querySelector(`[data-view="${view}"]`).classList.add('active');$('title').textContent=titles[view][0];$('subtitle').textContent=titles[view][1]}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>go(b.dataset.view));document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));$('openLesson').onclick=()=>{go('lessons');openEdit()};$('openStudentLesson').onclick=()=>openEdit();$('closeEditor').onclick=()=>$('lessonEditor').classList.add('hide');$('resetForm').onclick=()=>{$('lessonForm').reset();$('lessonId').value=''};$('prevMonth').onclick=()=>{const d=new Date(shownMonth+'-01');d.setMonth(d.getMonth()-1);shownMonth=d.toISOString().slice(0,7);render()};$('nextMonth').onclick=()=>{const d=new Date(shownMonth+'-01');d.setMonth(d.getMonth()+1);shownMonth=d.toISOString().slice(0,7);render()};$('lessonMonth').onchange=renderLessons;$('lessonStudent').onchange=renderLessons;$('workStudent').onchange=renderCoursework;$('financeMonth').onchange=renderFinance;$('financeStudent').onchange=renderFinance;$('clearLessonFilter').onclick=()=>{$('lessonStudent').value='';renderLessons()};$('clearFinanceFilter').onclick=()=>{$('financeStudent').value='';renderFinance()};document.addEventListener('click',e=>{const id=e.target.dataset.id;if(id){const l=lessons.find(x=>x.id===id);if(l)openEdit(l)}});$('lessonForm').onsubmit=async e=>{e.preventDefault();const payload={student_id:$('formStudent').value,lesson_date:$('formDate').value,start_time:$('formStart').value,end_time:$('formEnd').value,hours:Number($('formHours').value),rate:Number($('formRate').value),status:$('formStatus').value,topic:$('formTopic').value,quiz_scope:$('formScope').value,quiz_score:$('formScore').value,next_exam:$('formExam').value,progress:$('formProgress').value,teacher_observation:$('formObservation').value,homework:$('formHomework').value};const id=$('lessonId').value;const q=id?db.from('lessons').update(payload).eq('id',id):db.from('lessons').insert(payload);const {error}=await q;if(error){alert('儲存失敗，請稍後再試。');return}$('lessonEditor').classList.add('hide');await load()};$('formStudent').onchange=()=>{$('formRate').value=students.find(s=>s.id===$('formStudent').value)?.default_rate||0};db.auth.onAuthStateChange((_e,s)=>{if(s)setTimeout(load,0)});load();
</script></body></html>
