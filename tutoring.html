<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>家教帳務與教學報告</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--soft:#eef1f6;--line:#dce1ea;--text:#1c222c;--muted:#657086;--accent:#a8386b;--ok:#28795d;--danger:#c54545}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 "PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}.top{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:12px;padding:13px clamp(16px,4vw,32px);background:#ffffffed;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}h1{font-size:19px;margin:0;margin-right:auto}.back,.btn{appearance:none;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text);font:inherit;font-weight:650;padding:8px 12px;text-decoration:none;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.danger{color:var(--danger)}main{max-width:1120px;margin:auto;padding:24px clamp(16px,4vw,32px) 50px}.intro{margin:0 0 20px;color:var(--muted)}.tabs{display:flex;gap:8px;margin-bottom:18px}.tab{border:0;border-radius:999px;background:var(--soft);padding:8px 15px;font:inherit;font-weight:700;cursor:pointer}.tab.active{background:var(--accent);color:#fff}.panel{display:none}.panel.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px;margin-bottom:16px;box-shadow:0 3px 16px #1c222c0a}.card h2{font-size:17px;margin:0 0 4px}.hint{color:var(--muted);font-size:13px;margin:0 0 14px}.form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}.field{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}input,select,textarea{width:100%;font:inherit;color:var(--text);background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 10px}textarea{min-height:72px;resize:vertical}.wide{grid-column:span 2}.actions{display:flex;gap:9px;align-items:end}.filter{display:flex;flex-wrap:wrap;gap:10px;align-items:end}.filter .field{min-width:150px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.metric{border-radius:11px;background:var(--soft);padding:12px}.metric b{display:block;font-size:22px}.metric span{font-size:12px;color:var(--muted);font-weight:700}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--muted)}.status{font-size:12px;border-radius:99px;padding:3px 8px;background:#edf3ef;color:var(--ok);font-weight:700}.status.absent{background:#fbeeee;color:var(--danger)}.row-actions{white-space:nowrap}.empty{color:var(--muted);padding:20px 0;text-align:center}.report{line-height:1.8}.report h3{margin:18px 0 5px;font-size:15px}.report .box{white-space:pre-wrap;background:var(--soft);padding:12px;border-radius:9px;min-height:45px}.print-only{display:none}@media(max-width:720px){.form{grid-template-columns:repeat(2,minmax(0,1fr))}.wide{grid-column:span 2}.summary{grid-template-columns:repeat(2,1fr)}.top .btn{padding:7px 9px}table{font-size:13px}.hide-sm{display:none}}@media print{body{background:#fff}.top,.tabs,.no-print{display:none!important}main{max-width:none;padding:0}.panel{display:none!important}.panel.active{display:block!important}.card{box-shadow:none;border:0;padding:0}.print-only{display:block}.report{font-size:14px}}
</style></head><body>
<header class="top"><a class="back" href="index.html">← 班表</a><h1>家教帳務與教學報告</h1><button class="btn" id="exportBtn">⬇ 備份</button><label class="btn">⬆ 匯入<input id="importFile" type="file" accept=".json,application/json" hidden></label></header>
<main><p class="intro">每完成一堂家教就登錄一次；系統會依月份與學生統計實到時數、學費，並產出可列印的學費單和教學狀況報告。資料只保存在此瀏覽器。</p>
<div class="tabs no-print"><button class="tab active" data-tab="log">登錄課次</button><button class="tab" data-tab="invoice">學費單</button><button class="tab" data-tab="report">教學報告</button></div>
<section class="panel active" id="log"><div class="card"><h2>新增家教課次</h2><p class="hint">費用以「實到時數 × 時薪」計算；請假或缺席課次會保留紀錄但不列入學費。</p><form id="lessonForm" class="form"><label class="field">學生姓名<input required name="student" maxlength="30" placeholder="例如：王小明"></label><label class="field">上課日期<input required type="date" name="date"></label><label class="field">時數（小時）<input required type="number" name="hours" min="0.25" step="0.25" value="2"></label><label class="field">時薪（元）<input required type="number" name="rate" min="0" step="50" value="800"></label><label class="field">出席狀態<select name="status"><option value="attended">實到</option><option value="leave">請假</option><option value="absent">缺席</option></select></label><label class="field wide">科目／本次主題<input name="topic" maxlength="100" placeholder="例如：高三物理｜電磁感應題型"></label><label class="field wide">本次進度與學習表現<textarea name="progress" placeholder="記錄完成的單元、理解情形與需要加強處…"></textarea></label><label class="field wide">作業與下次提醒<textarea name="homework" placeholder="例如：完成講義 p.32–35；下次小考動量守恆"></textarea></label><div class="actions"><button class="btn primary" type="submit">＋ 儲存課次</button></div></form></div><div class="card"><h2>已登錄課次</h2><div id="lessonTable"></div></div></section>
<section class="panel" id="invoice"><div class="card"><h2>月結學費單</h2><p class="hint">選擇月份與學生後可直接列印或另存 PDF。</p><div class="filter no-print"><label class="field">月份<input id="invoiceMonth" type="month"></label><label class="field">學生<select id="invoiceStudent"></select></label><button class="btn primary" id="printInvoice">🖨 列印學費單</button></div><div id="invoiceOutput"></div></div></section>
<section class="panel" id="report"><div class="card"><h2>教學狀況報告</h2><p class="hint">可提供給家長或學生，內容根據當月實際登錄課次整理。</p><div class="filter no-print"><label class="field">月份<input id="reportMonth" type="month"></label><label class="field">學生<select id="reportStudent"></select></label><button class="btn primary" id="printReport">🖨 列印報告</button></div><div id="reportOutput"></div></div></section></main>
<script>
(function(){'use strict';var KEY='my-schedule-tutoring-v1';var data={lessons:[]};function load(){try{var x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.lessons))data=x}catch(e){}}function save(){localStorage.setItem(KEY,JSON.stringify(data))}function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function money(n){return 'NT$ '+Number(n||0).toLocaleString('zh-TW')}function today(){return new Date().toISOString().slice(0,10)}function monthNow(){return today().slice(0,7)}function students(){return Array.from(new Set(data.lessons.map(function(x){return x.student}).filter(Boolean))).sort()}function fillSelect(id){var el=document.getElementById(id),old=el.value,ss=students();el.innerHTML=ss.length?ss.map(function(s){return '<option value="'+esc(s)+'">'+esc(s)+'</option>'}).join(''):'<option value="">尚無學生</option>';if(ss.indexOf(old)>=0)el.value=old}function lessonsFor(month,student){return data.lessons.filter(function(x){return (!month||x.date.slice(0,7)===month)&&(!student||x.student===student)}).sort(function(a,b){return b.date.localeCompare(a.date)})}function totals(xs){var paid=xs.filter(function(x){return x.status==='attended'});return {sessions:paid.length,hours:paid.reduce(function(n,x){return n+Number(x.hours)},0),amount:paid.reduce(function(n,x){return n+Number(x.hours)*Number(x.rate)},0),all:xs.length}}function status(x){return x.status==='attended'?'實到':x.status==='leave'?'請假':'缺席'}function renderLessons(){var xs=data.lessons.slice().sort(function(a,b){return b.date.localeCompare(a.date)}),h='';if(!xs.length){document.getElementById('lessonTable').innerHTML='<p class="empty">尚未登錄課次。</p>';return}h='<table><thead><tr><th>日期</th><th>學生</th><th class="hide-sm">主題</th><th>時數</th><th>狀態</th><th>費用</th><th></th></tr></thead><tbody>'+xs.map(function(x){var fee=x.status==='attended'?Number(x.hours)*Number(x.rate):0;return '<tr><td>'+x.date+'</td><td>'+esc(x.student)+'</td><td class="hide-sm">'+esc(x.topic||'—')+'</td><td>'+x.hours+'</td><td><span class="status '+(x.status==='attended'?'':'absent')+'">'+status(x)+'</span></td><td>'+money(fee)+'</td><td class="row-actions"><button class="btn danger" data-del="'+x.id+'">刪除</button></td></tr>'}).join('')+'</tbody></table>';document.getElementById('lessonTable').innerHTML=h}function metrics(t){return '<div class="summary"><div class="metric"><b>'+t.sessions+'</b><span>實到堂數</span></div><div class="metric"><b>'+t.hours+'</b><span>實到時數</span></div><div class="metric"><b>'+money(t.amount)+'</b><span>本月學費</span></div><div class="metric"><b>'+t.all-t.sessions+'</b><span>請假／缺席</span></div></div>'}function renderInvoice(){fillSelect('invoiceStudent');var m=document.getElementById('invoiceMonth').value,s=document.getElementById('invoiceStudent').value,xs=lessonsFor(m,s),t=totals(xs);var rows=xs.map(function(x){return '<tr><td>'+x.date+'</td><td>'+esc(x.topic||'家教課程')+'</td><td>'+status(x)+'</td><td>'+x.hours+'</td><td>'+money(x.status==='attended'?x.hours*x.rate:0)+'</td></tr>'}).join('');document.getElementById('invoiceOutput').innerHTML='<div class="report"><h2 class="print-only">家教學費單</h2><h3>'+esc(s||'請先新增學生')+'｜'+(m||'月份')+'</h3>'+metrics(t)+'<table><thead><tr><th>日期</th><th>課程主題</th><th>狀態</th><th>時數</th><th>費用</th></tr></thead><tbody>'+ (rows||'<tr><td colspan="5" class="empty">此條件尚無紀錄</td></tr>')+'</tbody></table><h3 style="text-align:right">應繳金額：'+money(t.amount)+'</h3></div>'}function renderReport(){fillSelect('reportStudent');var m=document.getElementById('reportMonth').value,s=document.getElementById('reportStudent').value,xs=lessonsFor(m,s),t=totals(xs),att=xs.filter(function(x){return x.status==='attended'});var progress=att.map(function(x){return '【'+x.date+'｜'+(x.topic||'家教課程')+'】\n'+(x.progress||'未填寫')}).join('\n\n');var homework=att.map(function(x){return '【'+x.date+'】 '+(x.homework||'未填寫')}).join('\n');document.getElementById('reportOutput').innerHTML='<article class="report"><h2 class="print-only">教學狀況報告</h2><h3>'+esc(s||'請先新增學生')+'｜'+(m||'月份')+'</h3>'+metrics(t)+'<h3>本月上課概況</h3><div class="box">本月共安排 '+t.all+' 堂課，實到 '+t.sessions+' 堂，累計 '+t.hours+' 小時。</div><h3>教學進度與學習表現</h3><div class="box">'+esc(progress||'此條件尚無實到課次紀錄。')+'</div><h3>作業與下次提醒</h3><div class="box">'+esc(homework||'此條件尚無資料。')+'</div></article>'}function render(){renderLessons();renderInvoice();renderReport()}document.getElementById('lessonForm').date.value=today();document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){document.querySelectorAll('.tab,.panel').forEach(function(x){x.classList.remove('active')});b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')}});document.getElementById('lessonForm').onsubmit=function(e){e.preventDefault();var f=new FormData(e.target),x={id:Date.now().toString(36),student:f.get('student').trim(),date:f.get('date'),hours:Number(f.get('hours')),rate:Number(f.get('rate')),status:f.get('status'),topic:f.get('topic').trim(),progress:f.get('progress').trim(),homework:f.get('homework').trim()};data.lessons.push(x);save();e.target.reset();e.target.date.value=today();e.target.hours.value=2;e.target.rate.value=800;render()};document.addEventListener('click',function(e){var id=e.target.dataset.del;if(id){data.lessons=data.lessons.filter(function(x){return x.id!==id});save();render()}});['invoiceMonth','invoiceStudent'].forEach(function(id){document.getElementById(id).onchange=renderInvoice});['reportMonth','reportStudent'].forEach(function(id){document.getElementById(id).onchange=renderReport});document.getElementById('printInvoice').onclick=function(){document.querySelector('[data-tab="invoice"]').click();window.print()};document.getElementById('printReport').onclick=function(){document.querySelector('[data-tab="report"]').click();window.print()};document.getElementById('exportBtn').onclick=function(){var a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(data,null,2));a.download='家教帳務備份.json';a.click()};document.getElementById('importFile').onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var x=JSON.parse(r.result);if(!Array.isArray(x.lessons))throw 0;data=x;save();render();alert('匯入完成')}catch(err){alert('檔案格式不正確')}};r.readAsText(f)};load();document.getElementById('invoiceMonth').value=monthNow();document.getElementById('reportMonth').value=monthNow();render()})();
</script></body></html>
