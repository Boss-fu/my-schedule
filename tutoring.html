<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>家教帳務與教學報告</title>
<style>
:root{--bg:#f4f6f9;--surface:#fff;--surface-2:#eef1f6;--surface-3:#e6eaf1;--border:#dce1ea;--border-strong:#c7cdd9;--text:#1c222c;--text-dim:#586074;--text-mute:#8a93a5;--accent:#2f7fce;--private:#a8386b;--ok:#2f9079;--danger:#e0492f;--shadow:0 1px 2px rgba(20,30,50,.06),0 6px 20px rgba(20,30,50,.07);--radius:14px}
:root[data-theme="dark"]{--bg:#0f1218;--surface:#171b23;--surface-2:#1e2430;--surface-3:#262d3b;--border:#2a323f;--border-strong:#3a4454;--text:#e7ebf2;--text-dim:#a3adc0;--text-mute:#6d7789;--accent:#5aa0ec;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 26px rgba(0,0,0,.35)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 "PingFang TC","Noto Sans TC","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums}.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.2) blur(10px);border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:12px clamp(14px,4vw,28px)}.brand{display:flex;align-items:center;gap:10px;margin-right:auto;text-decoration:none;color:var(--text)}.brand-dot{width:11px;height:11px;border-radius:3px;background:conic-gradient(from 210deg,#2f7fce,#2f9079,#d98a2b,#a8386b,#2f7fce)}h1{font-size:19px;font-weight:700;margin:0;letter-spacing:.5px}.brand small{color:var(--text-mute);font-size:12px;font-weight:500}.topbar-actions{display:flex;align-items:center;gap:8px}.btn{appearance:none;font:inherit;font-weight:600;font-size:14px;cursor:pointer;border-radius:10px;padding:8px 14px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);transition:transform .08s,background .15s,border-color .15s;text-decoration:none;display:inline-flex;align-items:center;gap:6px}.btn:hover{background:var(--surface-2)}.btn:active{transform:translateY(1px)}.btn-primary{background:var(--accent);border-color:transparent;color:#fff}.btn-primary:hover{filter:brightness(1.06);background:var(--accent)}.btn-icon{padding:8px 10px}.back{color:var(--text-dim)}main{max-width:1180px;margin:0 auto;padding:clamp(14px,3.5vw,26px)}.view-head{display:flex;align-items:baseline;gap:10px;margin:2px 2px 16px}.view-head h2{margin:0;font-size:22px;font-weight:750;letter-spacing:.4px}.view-head span,.intro,.hint{color:var(--text-mute);font-size:13px}.intro{margin:0 2px 18px}.tabs{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:3px;gap:2px;margin-bottom:16px}.tab{appearance:none;border:0;background:transparent;color:var(--text-dim);font:inherit;font-size:14px;font-weight:600;padding:6px 14px;border-radius:8px;cursor:pointer}.tab.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}.panel{display:none}.panel.active{display:block}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}.card h2{font-size:17px;margin:0 0 4px}.hint{margin:0 0 14px}.form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}.field{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--text-dim)}input,select,textarea{width:100%;font:inherit;color:var(--text);background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:9px 10px}input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}textarea{min-height:72px;resize:vertical}.wide{grid-column:span 2}.actions{display:flex;gap:9px;align-items:end}.filter{display:flex;flex-wrap:wrap;gap:10px;align-items:end}.filter .field{min-width:150px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.metric{border-radius:11px;background:var(--surface-2);padding:12px}.metric b{display:block;font-size:22px}.metric span{font-size:12px;color:var(--text-mute);font-weight:700}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--border);vertical-align:top}th{font-size:12px;color:var(--text-mute)}.status{font-size:12px;border-radius:99px;padding:3px 8px;background:color-mix(in srgb,var(--ok) 14%,var(--surface));color:var(--ok);font-weight:700}.status.absent{background:color-mix(in srgb,var(--danger) 14%,var(--surface));color:var(--danger)}.row-actions{white-space:nowrap}.empty{color:var(--text-mute);padding:20px 0;text-align:center}.report{line-height:1.8}.report h3{margin:18px 0 5px;font-size:15px}.report .box{white-space:pre-wrap;background:var(--surface-2);padding:12px;border-radius:9px;min-height:45px}.doc-head{display:flex;justify-content:space-between;gap:18px;border-bottom:3px solid var(--private);padding-bottom:14px;margin:8px 0 20px}.doc-title{font-size:27px;font-weight:800;letter-spacing:1px;margin:0;color:var(--text)}.doc-meta{text-align:right;color:var(--text-dim);font-size:13px}.doc-label{display:inline-block;color:var(--text-mute);min-width:72px}.amount-box{margin:22px 0 6px;padding:15px 18px;background:color-mix(in srgb,var(--private) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--private) 28%,var(--border));border-radius:10px;text-align:right;font-size:16px;font-weight:700}.amount-box b{font-size:26px;color:var(--private);margin-left:10px}.doc-foot{border-top:1px solid var(--border);margin-top:25px;padding-top:12px;color:var(--text-mute);font-size:12px;white-space:pre-wrap}.print-only{display:none}@media(max-width:720px){.form{grid-template-columns:repeat(2,minmax(0,1fr))}.wide{grid-column:span 2}.summary{grid-template-columns:repeat(2,1fr)}.topbar .btn{padding:7px 9px}table{font-size:13px}.hide-sm{display:none}}@media print{body{background:#fff;color:#111}.topbar,.tabs,.no-print{display:none!important}main{max-width:none;padding:0}.panel{display:none!important}.panel.active{display:block!important}.card{box-shadow:none;border:0;padding:0}.print-only{display:block}.report{font-size:14px}}
</style></head><body>
<header class="topbar"><a class="brand" href="index.html"><span class="brand-dot"></span><h1>我的班表 <small>／家教帳務</small></h1></a><div class="topbar-actions"><a class="btn back" href="index.html">← 班表</a><button class="btn btn-icon" id="themeBtn" title="切換深色／淺色">🌓</button><button class="btn" id="exportBtn">⬇ 備份</button><label class="btn">⬆ 匯入<input id="importFile" type="file" accept=".json,application/json" hidden></label></div></header>
<main><p class="intro">每完成一堂家教就登錄一次；系統會依月份與學生統計實到時數、學費，並產出可列印的學費單和教學狀況報告。資料只保存在此瀏覽器。</p>
<section class="card no-print" id="profileCard"><h2>文件抬頭與收款資訊</h2><p class="hint">這些資料會顯示在列印給家長的學費單與教學報告上。</p><div class="form"><label class="field">教師／工作室名稱<input id="profileTeacher" placeholder="例如：傅老師家教"></label><label class="field">聯絡方式<input id="profilePhone" placeholder="例如：LINE：xxx／09xx-xxx-xxx"></label><label class="field wide">繳費說明／帳戶資訊<input id="profilePayment" placeholder="例如：請於 8/10 前匯款至台新銀行 812-1234-5678-9012"></label></div></section><div class="tabs no-print"><button class="tab active" data-tab="log">登錄課次</button><button class="tab" data-tab="invoice">學費單</button><button class="tab" data-tab="report">教學報告</button></div>
<section class="panel active" id="log"><div class="card"><h2>新增家教課次</h2><p class="hint">費用以「實到時數 × 時薪」計算；請假或缺席課次會保留紀錄但不列入學費。</p><form id="lessonForm" class="form"><label class="field">學生姓名<input required name="student" maxlength="30" placeholder="例如：王小明"></label><label class="field">上課日期<input required type="date" name="date"></label><label class="field">時數（小時）<input required type="number" name="hours" min="0.25" step="0.25" value="2"></label><label class="field">時薪（元）<input required type="number" name="rate" min="0" step="50" value="800"></label><label class="field">出席狀態<select name="status"><option value="attended">實到</option><option value="leave">請假</option><option value="absent">缺席</option></select></label><label class="field wide">科目／本次主題<input name="topic" maxlength="100" placeholder="例如：高三物理｜電磁感應題型"></label><label class="field wide">本次進度與學習表現<textarea name="progress" placeholder="記錄完成的單元、理解情形與需要加強處…"></textarea></label><label class="field wide">作業與下次提醒<textarea name="homework" placeholder="例如：完成講義 p.32–35；下次小考動量守恆"></textarea></label><div class="actions"><button class="btn primary" type="submit">＋ 儲存課次</button></div></form></div><div class="card"><h2>已登錄課次</h2><div id="lessonTable"></div></div></section>
<section class="panel" id="invoice"><div class="card"><h2>月結學費單</h2><p class="hint">選擇月份與學生後可直接列印或另存 PDF。</p><div class="filter no-print"><label class="field">月份<input id="invoiceMonth" type="month"></label><label class="field">學生<select id="invoiceStudent"></select></label><button class="btn primary" id="printInvoice">🖨 列印學費單</button></div><div id="invoiceOutput"></div></div></section>
<section class="panel" id="report"><div class="card"><h2>教學狀況報告</h2><p class="hint">可提供給家長或學生，內容根據當月實際登錄課次整理。</p><div class="filter no-print"><label class="field">月份<input id="reportMonth" type="month"></label><label class="field">學生<select id="reportStudent"></select></label><button class="btn primary" id="printReport">🖨 列印報告</button></div><div id="reportOutput"></div></div></section></main>
<script>
(function(){'use strict';var KEY='my-schedule-tutoring-v1';var data={lessons:[],profile:{teacher:"家教老師",phone:"",payment:""}};function load(){try{var x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.lessons)){data=x;if(!data.profile)data.profile={teacher:"家教老師",phone:"",payment:""}}}catch(e){}}function save(){localStorage.setItem(KEY,JSON.stringify(data))}function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function money(n){return 'NT$ '+Number(n||0).toLocaleString('zh-TW')}function today(){return new Date().toISOString().slice(0,10)}function monthNow(){return today().slice(0,7)}function students(){return Array.from(new Set(data.lessons.map(function(x){return x.student}).filter(Boolean))).sort()}function fillSelect(id){var el=document.getElementById(id),old=el.value,ss=students();el.innerHTML=ss.length?ss.map(function(s){return '<option value="'+esc(s)+'">'+esc(s)+'</option>'}).join(''):'<option value="">尚無學生</option>';if(ss.indexOf(old)>=0)el.value=old}function lessonsFor(month,student){return data.lessons.filter(function(x){return (!month||x.date.slice(0,7)===month)&&(!student||x.student===student)}).sort(function(a,b){return b.date.localeCompare(a.date)})}function totals(xs){var paid=xs.filter(function(x){return x.status==='attended'});return {sessions:paid.length,hours:paid.reduce(function(n,x){return n+Number(x.hours)},0),amount:paid.reduce(function(n,x){return n+Number(x.hours)*Number(x.rate)},0),all:xs.length}}function status(x){return x.status==='attended'?'實到':x.status==='leave'?'請假':'缺席'}function renderLessons(){var xs=data.lessons.slice().sort(function(a,b){return b.date.localeCompare(a.date)}),h='';if(!xs.length){document.getElementById('lessonTable').innerHTML='<p class="empty">尚未登錄課次。</p>';return}h='<table><thead><tr><th>日期</th><th>學生</th><th class="hide-sm">主題</th><th>時數</th><th>狀態</th><th>費用</th><th></th></tr></thead><tbody>'+xs.map(function(x){var fee=x.status==='attended'?Number(x.hours)*Number(x.rate):0;return '<tr><td>'+x.date+'</td><td>'+esc(x.student)+'</td><td class="hide-sm">'+esc(x.topic||'—')+'</td><td>'+x.hours+'</td><td><span class="status '+(x.status==='attended'?'':'absent')+'">'+status(x)+'</span></td><td>'+money(fee)+'</td><td class="row-actions"><button class="btn danger" data-del="'+x.id+'">刪除</button></td></tr>'}).join('')+'</tbody></table>';document.getElementById('lessonTable').innerHTML=h}function metrics(t){return '<div class="summary"><div class="metric"><b>'+t.sessions+'</b><span>實到堂數</span></div><div class="metric"><b>'+t.hours+'</b><span>實到時數</span></div><div class="metric"><b>'+money(t.amount)+'</b><span>本月學費</span></div><div class="metric"><b>'+t.all-t.sessions+'</b><span>請假／缺席</span></div></div>'}function monthLabel(m){return m?m.replace('-',' 年 ')+' 月':'本月'}function profile(){return data.profile||{teacher:'家教老師',phone:'',payment:''}}function documentHead(title,student,month){var p=profile();return '<div class="doc-head"><div><h2 class="doc-title">'+title+'</h2><div style="color:var(--text-mute);margin-top:4px">學生：'+esc(student||'—')+'　｜　期間：'+esc(monthLabel(month))+'</div></div><div class="doc-meta"><b>'+esc(p.teacher||'家教老師')+'</b><br>'+esc(p.phone||'')+'</div></div>'}function renderInvoice(){fillSelect('invoiceStudent');var m=document.getElementById('invoiceMonth').value,s=document.getElementById('invoiceStudent').value,xs=lessonsFor(m,s),t=totals(xs),p=profile();var rows=xs.map(function(x){return '<tr><td>'+x.date+'</td><td>'+esc(x.topic||'家教課程')+'</td><td>'+status(x)+'</td><td>'+x.hours+'</td><td>'+money(x.status==='attended'?x.hours*x.rate:0)+'</td></tr>'}).join('');document.getElementById('invoiceOutput').innerHTML='<div class="report invoice-doc">'+documentHead('家教學費通知單',s,m)+metrics(t)+'<table><thead><tr><th>上課日期</th><th>課程內容</th><th>出席狀態</th><th>時數</th><th>本次費用</th></tr></thead><tbody>'+ (rows||'<tr><td colspan="5" class="empty">此條件尚無紀錄</td></tr>')+'</tbody></table><div class="amount-box">本期應繳金額 <b>'+money(t.amount)+'</b></div><div class="doc-foot">'+esc(p.payment||'付款資訊請洽教師。')+'\n如對課程明細或費用有任何疑問，歡迎與教師聯繫。</div></div>'}function renderReport(){fillSelect('reportStudent');var m=document.getElementById('reportMonth').value,s=document.getElementById('reportStudent').value,xs=lessonsFor(m,s),t=totals(xs),att=xs.filter(function(x){return x.status==='attended'}),p=profile();var progress=att.map(function(x){return '【'+x.date+'｜'+(x.topic||'家教課程')+'】\n'+(x.progress||'未填寫')}).join('\n\n');var homework=att.map(function(x){return '【'+x.date+'】 '+(x.homework||'未填寫')}).join('\n');document.getElementById('reportOutput').innerHTML='<article class="report">'+documentHead('教學狀況報告',s,m)+metrics(t)+'<h3>本月上課概況</h3><div class="box">本月共安排 '+t.all+' 堂課，實到 '+t.sessions+' 堂，累計 '+t.hours+' 小時。</div><h3>教學進度與學習表現</h3><div class="box">'+esc(progress||'此條件尚無實到課次紀錄。')+'</div><h3>作業與下次提醒</h3><div class="box">'+esc(homework||'此條件尚無資料。')+'</div><div class="doc-foot">'+esc(p.teacher||'家教老師')+(p.phone?'　｜　'+esc(p.phone):'')+'</div></article>} function render(){renderLessons();renderInvoice();renderReport()}(function(){var root=document.documentElement;try{var saved=localStorage.getItem('my-schedule-theme');if(saved)root.setAttribute('data-theme',saved)}catch(e){}document.getElementById('themeBtn').onclick=function(){var now=root.getAttribute('data-theme');var next=now==='dark'?'light':(now==='light'?'dark':(window.matchMedia('(prefers-color-scheme: dark)').matches?'light':'dark'));root.setAttribute('data-theme',next);try{localStorage.setItem('my-schedule-theme',next)}catch(e){}}})();document.getElementById('lessonForm').date.value=today();document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){document.querySelectorAll('.tab,.panel').forEach(function(x){x.classList.remove('active')});b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')}});document.getElementById('lessonForm').onsubmit=function(e){e.preventDefault();var f=new FormData(e.target),x={id:Date.now().toString(36),student:f.get('student').trim(),date:f.get('date'),hours:Number(f.get('hours')),rate:Number(f.get('rate')),status:f.get('status'),topic:f.get('topic').trim(),progress:f.get('progress').trim(),homework:f.get('homework').trim()};data.lessons.push(x);save();e.target.reset();e.target.date.value=today();e.target.hours.value=2;e.target.rate.value=800;render()};document.addEventListener('click',function(e){var id=e.target.dataset.del;if(id){data.lessons=data.lessons.filter(function(x){return x.id!==id});save();render()}});['invoiceMonth','invoiceStudent'].forEach(function(id){document.getElementById(id).onchange=renderInvoice});['reportMonth','reportStudent'].forEach(function(id){document.getElementById(id).onchange=renderReport});document.getElementById('printInvoice').onclick=function(){document.querySelector('[data-tab="invoice"]').click();window.print()};document.getElementById('printReport').onclick=function(){document.querySelector('[data-tab="report"]').click();window.print()};document.getElementById('exportBtn').onclick=function(){var a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(data,null,2));a.download='家教帳務備份.json';a.click()};document.getElementById('importFile').onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var x=JSON.parse(r.result);if(!Array.isArray(x.lessons))throw 0;data=x;save();render();alert('匯入完成')}catch(err){alert('檔案格式不正確')}};r.readAsText(f)};load();document.getElementById('profileTeacher').value=profile().teacher||'';document.getElementById('profilePhone').value=profile().phone||'';document.getElementById('profilePayment').value=profile().payment||'';['profileTeacher','profilePhone','profilePayment'].forEach(function(id){document.getElementById(id).oninput=function(){data.profile.teacher=document.getElementById('profileTeacher').value.trim();data.profile.phone=document.getElementById('profilePhone').value.trim();data.profile.payment=document.getElementById('profilePayment').value.trim();save();renderInvoice();renderReport()}});document.getElementById('invoiceMonth').value=monthNow();document.getElementById('reportMonth').value=monthNow();render()})();
</script></body></html>
