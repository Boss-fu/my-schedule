<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>家長端｜福大自然家教</title><style>html,body{margin:0;width:100%;height:100%;background:#f4f7fb}iframe{width:100%;height:100%;border:0}</style></head>
<body><iframe title="家長端" src="parent-preview.html"></iframe><script src="supabase-config.js"></script><script type="module" src="parent-finance-profile.js?v=20260802-invoice-sections"></script><script type="module" src="parent-rate-display.js"></script><script type="module" src="auth.js?v=20260802-parent-password-session"></script><script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
  const db = createClient(window.SUPABASE_CONFIG.url, window.SUPABASE_CONFIG.publishableKey);
  const frame = document.querySelector('iframe[title="家長端"]');
  let loadedForSession = false;

  });
