<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>家長端｜課程明細</title>
  <style>
    :root{--bg:#f4f6f9;--surface:#fff;--surface2:#eef1f6;--border:#dce1ea;--text:#1c222c;--muted:#647084;--accent:#2f7fce;--ok:#2f9079;--radius:14px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 "PingFang TC","Noto Sans TC",system-ui,sans-serif}.top{background:var(--surface);border-bottom:1px solid var(--border);padding:18px max(20px,calc((100vw - 980px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:19px;font-weight:800}.brand small{font-size:13px;color:var(--muted);font-weight:500}main{max-width:980px;margin:auto;padding:26px 18px}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:0 3px 16px rgba(25,40,70,.05)}h1,h2,h3{margin:0}h1{font-size:25px}h2{font-size:18px}.hint,.muted{color:var(--muted)}.filter{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px}.field{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted);min-width:170px}select{font:inherit;background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:9px 10px;color:var(--text)}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}.metric{background:var(--surface2);padding:13px;border-radius:10px}.metric b{display:block;font-size:22px}.metric span{color:var(--muted);font-size:12px;font-weight:700}.lesson{border-left:4px solid var(--accent);padding:15px 16px;margin:13px 0;background:var(--surface2);border-radius:0 10px 10px 0}.lesson-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:800}.label{font-size:12px;color:var(--muted);font-weight:700;margin-top:11px}.value{white-space:pre-wrap}.empty{text-align:center;color:var(--muted);padding:30px}.status{font-size:12px;color:var(--ok)}@media(max-width:600px){.summary{grid-template-columns:1fr}.top{padding:15px 18px}}
  </style>
</head>
<body>
  <header class="top"><div class="brand">我的班表 <small>／家長端</small></div><div class="muted">課程進度與明細</div></header>
  <main>
    <section class="card"><h1>學生課程資訊</h1><p class="hint">查看每一堂課的上課時間、教學進度與作業提醒。</p><div class="filter"><label class="field">學生<select id="student"></select></label><label class="field">月份<select id="month"></select></label></div><div id="summary"></div></section>
    <section class="card"><h2>課程明細</h2><div id="lessons"></div></section>
  </main>
  <script>
  (function(){'use strict';var KEY='my-schedule-tutoring-v1';function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function get(){try{var d=JSON.parse(localStorage.getItem(KEY));return d&&typeof d==='object'?d:{lessons:[],students:[]}}catch(e){return{lessons:[],students:[]}}}function money(n){return'NT$ '+Number(n||0).toLocaleString('zh-TW')}function time(x){return x.startTime&&x.endTime?x.startTime+'–'+x.endTime:'未填時段'}function init(){var d=get(),students=(d.students||[]).map(function(x){return x.name});(d.lessons||[]).forEach(function(x){if(x.student&&students.indexOf(x.student)<0)students.push(x.student)});var qs=new URLSearchParams(location.search),student=qs.get('student')||students[0]||'',months=[];(d.lessons||[]).forEach(function(x){var m=(x.date||'').slice(0,7);if(m&&months.indexOf(m)<0)months.push(m)});months.sort().reverse();var sm=document.getElementById('student'),mm=document.getElementById('month');sm.innerHTML=students.map(function(x){return'<option value="'+esc(x)+'">'+esc(x)+'</option>'}).join('')||'<option>尚無資料</option>';mm.innerHTML='<option value="">全部月份</option>'+months.map(function(x){return'<option value="'+x+'">'+x+'</option>'}).join('');sm.value=student;sm.onchange=render;mm.onchange=render;render()}function render(){var d=get(),s=document.getElementById('student').value,m=document.getElementById('month').value,xs=(d.lessons||[]).filter(function(x){return x.student===s&&(!m||x.date.slice(0,7)===m)}).sort(function(a,b){return b.date.localeCompare(a.date)}),paid=xs.filter(function(x){return x.status==='attended'}),hours=paid.reduce(function(n,x){return n+Number(x.hours)},0),amount=paid.reduce(function(n,x){return n+Number(x.hours)*Number(x.rate)},0);document.getElementById('summary').innerHTML='<div class="summary"><div class="metric"><b>'+paid.length+'</b><span>實到堂數</span></div><div class="metric"><b>'+hours+'</b><span>實到時數</span></div><div class="metric"><b>'+money(amount)+'</b><span>本期課程費用</span></div></div>';document.getElementById('lessons').innerHTML=xs.length?xs.map(function(x){var st=x.status==='attended'?'實到':x.status==='leave'?'請假':'缺席';return'<article class="lesson"><div class="lesson-head"><span>'+esc(x.date)+'　'+esc(time(x))+'</span><span class="status">'+st+'</span></div><div class="label">課程主題</div><div class="value">'+esc(x.topic||'未填寫')+'</div><div class="label">教學進度與學習表現</div><div class="value">'+esc(x.progress||'未填寫')+'</div><div class="label">作業與下次提醒</div><div class="value">'+esc(x.homework||'未填寫')+'</div></article>'}).join(''):'<p class="empty">此條件尚無課程紀錄。</p>'}init()})();
  </script>
  <script src="supabase-config.js"></script><script type="module" src="auth.js"></script>
</body>
</html>
